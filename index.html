<title>영어뇌 랩 · 라이브 아카데미 스타일 영어 트레이닝</title>
<style>
/* 영어뇌 랩 — deep navy / emerald theme (vanilla CSS, no dependencies) */
:root {
  --navy-900: #071a2b;
  --navy-800: #0a2239;
  --navy-700: #10314a;
  --emerald-600: #047857;
  --emerald-500: #10b981;
  --emerald-400: #34d399;
  --emerald-100: #d9f5ea;
  --bg: #eef4f3;
  --bg-2: #f8fbfb;
  --surface: #ffffff;
  --surface-2: #f3f8f7;
  --text: #0d2735;
  --text-2: #5b7683;
  --text-3: #8ba1ab;
  --line: #dbe7e6;
  --line-2: #eaf1f0;
  --brand: #047857;
  --brand-soft: #e2f6ee;
  --on-brand: #ffffff;
  --ok: #059669;
  --warn: #b45309;
  --bad: #dc2626;
  --bad-soft: #fdecec;
  --ok-soft: #e6f7f0;
  --shadow: 0 10px 30px rgba(9, 43, 60, 0.08);
  --shadow-lg: 0 24px 60px rgba(6, 32, 46, 0.22);
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
  --tabbar-h: 62px;
}

html[data-theme="dark"] {
  --bg: #05141d;
  --bg-2: #071b26;
  --surface: #0b2230;
  --surface-2: #0f2b3a;
  --text: #e6f2f0;
  --text-2: #9db6c0;
  --text-3: #78909b;
  --line: #17323f;
  --line-2: #122936;
  --brand: #34d399;
  --brand-soft: #0e3a30;
  --on-brand: #04150f;
  --emerald-100: #0d3b31;
  --bad-soft: #3a1a1c;
  --ok-soft: #0d3a2d;
  --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic",
    "Segoe UI", Roboto, "Helvetica Neue", "Liberation Sans", Arial, "FreeSans", sans-serif;
  background:
    radial-gradient(900px 420px at 78% -8%, rgba(16, 185, 129, 0.16), transparent 62%),
    radial-gradient(700px 380px at -10% 8%, rgba(13, 61, 90, 0.14), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 52%, var(--bg) 100%);
  color: var(--text);
  min-height: 100dvh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

/* ------------------------------------------------------------ top bar */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 12px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  background: linear-gradient(152deg, #0a2239 6%, #0f4b43 58%, #10b981 100%);
  color: #eafff6; display: grid; place-items: center;
  font-weight: 800; font-size: 15px; letter-spacing: -0.03em;
  box-shadow: 0 6px 16px rgba(7, 45, 39, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.22);
}
.brand-name { font-size: 15.5px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
.brand-sub { font-size: 10.5px; color: var(--text-3); letter-spacing: .04em; font-weight: 600; }
.streak {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 11px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 12.5px; font-weight: 800; color: var(--text);
  box-shadow: var(--shadow);
}
.streak .flame { font-size: 13px; }
.streak small { font-weight: 600; color: var(--text-2); font-size: 10.5px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  display: grid; place-items: center; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
  transition: transform .15s ease, color .15s ease;
}
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { stroke: currentColor; }

/* ------------------------------------------------------------ content */
.content { flex: 1; padding: 6px 18px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 26px); }
.h1 { font-size: 23px; font-weight: 800; letter-spacing: -0.035em; margin: 10px 0 2px; line-height: 1.32; }
.h1 em { font-style: normal; color: var(--brand); }
.sub { margin: 0 0 16px; color: var(--text-2); font-size: 12.5px; }
.section-title {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-3); margin: 24px 2px 10px;
}
.section-title span { font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--text-3); }

/* hero */
.hero {
  position: relative; overflow: hidden;
  border-radius: var(--r-lg); padding: 20px;
  background:
    radial-gradient(420px 200px at 88% -20%, rgba(52, 211, 153, .45), transparent 62%),
    radial-gradient(300px 180px at 0% 120%, rgba(16, 185, 129, .22), transparent 70%),
    linear-gradient(150deg, #071a2b 0%, #0a2239 42%, #0b3a3a 100%);
  color: #f2fbf8; box-shadow: var(--shadow-lg); margin-top: 6px;
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 82% 18%, rgba(255, 255, 255, .12), transparent 46%);
  pointer-events: none;
}
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; z-index: 1; }
.hero-kicker { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #8fe3c8; font-weight: 800; }
.hero-title { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; margin: 6px 0 4px; line-height: 1.35; }
.hero-note { font-size: 12px; color: rgba(232, 250, 244, .78); margin: 0; }
.ring { position: relative; width: 66px; height: 66px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring-track { stroke: rgba(255, 255, 255, .18); }
.ring-fill { stroke: #4ade9f; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ring-num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 800; letter-spacing: -0.03em; }
.hero-bar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .17); margin: 16px 0 8px; overflow: hidden; position: relative; z-index: 1; }
.hero-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #34d399, #a7f3d0); transition: width .5s ease; }
.hero-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: rgba(224, 246, 240, .72); position: relative; z-index: 1; }
.hero-cta {
  position: relative; z-index: 1; margin-top: 16px; width: 100%;
  border: 0; cursor: pointer; border-radius: 14px; padding: 14px 16px;
  background: linear-gradient(180deg, #37e0a5, #10b981);
  color: #04241a; font-weight: 800; font-size: 14.5px; letter-spacing: -0.01em;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 12px 24px rgba(16, 185, 129, .3), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .15s ease;
}
.hero-cta:active { transform: scale(.985); }
.hero-cta small { font-weight: 700; opacity: .72; font-size: 12px; }

/* chapter list */
.chapter {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 15px 15px 13px; margin-bottom: 12px; box-shadow: var(--shadow);
  transition: border-color .18s ease, transform .18s ease;
}
.chapter.open { border-color: color-mix(in srgb, var(--brand) 42%, var(--line)); }
.chapter-head { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.chapter-no {
  width: 40px; height: 40px; border-radius: 13px; flex: none; display: grid; place-items: center;
  font-weight: 800; font-size: 13px; letter-spacing: -0.02em;
  background: var(--brand-soft); color: var(--brand);
}
.chapter.open .chapter-no { background: linear-gradient(150deg, #0a2239, #0f766e); color: #e9fff7; }
.chapter-main { flex: 1; min-width: 0; }
.chapter-name { font-size: 14.5px; font-weight: 800; letter-spacing: -0.02em; margin: 1px 0 1px; }
.chapter-sub { font-size: 11.5px; color: var(--text-2); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.chapter-count { font-size: 11px; font-weight: 800; color: var(--brand); }
.chev { width: 16px; height: 16px; color: var(--text-3); transition: transform .2s ease; }
.chapter.open .chev { transform: rotate(180deg); }
.chapter-bar { height: 4px; border-radius: 99px; background: var(--line-2); margin: 11px 0 0; overflow: hidden; }
.chapter-bar i { display: block; height: 100%; background: linear-gradient(90deg, #10b981, #6ee7b7); border-radius: 99px; }
.chapter-body { display: none; margin-top: 12px; }
.chapter.open .chapter-body { display: block; }
.chapter-tagline { font-size: 12px; color: var(--text-2); margin: 0 0 10px; line-height: 1.6; }

.unit {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 11px 10px; border-radius: var(--r-sm); border: 1px solid transparent;
  background: none; text-align: left; cursor: pointer; color: inherit; font: inherit;
  transition: background .15s ease;
}
.unit + .unit { border-top: 1px solid var(--line-2); border-radius: 0; }
.unit:active { background: var(--surface-2); }
.unit-n {
  width: 24px; height: 24px; border-radius: 8px; flex: none; display: grid; place-items: center;
  font-size: 11px; font-weight: 800; color: var(--text-3); background: var(--surface-2);
}
.unit.done .unit-n { background: var(--brand); color: var(--on-brand); }
.unit-txt { flex: 1; min-width: 0; }
.unit-txt { display: block; }
.unit-title { display: block; font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.38; }
.unit-ko { display: block; font-size: 11px; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit-go { font-size: 11px; font-weight: 800; color: var(--brand); flex: none; }
.unit.done .unit-go { color: var(--text-3); font-weight: 700; }

/* extras */
.extras { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
.extras summary {
  cursor: pointer; font-size: 12px; font-weight: 800; color: var(--text-2); list-style: none;
  display: flex; align-items: center; gap: 6px;
}
.extras summary::-webkit-details-marker { display: none; }
.extras summary::before { content: "＋"; color: var(--brand); font-weight: 900; }
.extras[open] summary::before { content: "－"; }
.ex { display: flex; gap: 8px; padding: 8px 0 0; font-size: 12.5px; line-height: 1.5; }
.ex b { color: var(--text); font-weight: 600; }
.ex span { color: var(--text-2); flex: none; }

/* ------------------------------------------------------------ tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; justify-content: center; gap: 2px;
  padding: 6px 12px calc(env(safe-area-inset-bottom, 0px) + 6px);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(18px) saturate(1.3);
  border-top: 1px solid var(--line);
}
.tabbar button {
  flex: 1; max-width: 150px; border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 4px; border-radius: 12px;
  font-size: 10.5px; font-weight: 700; color: var(--text-3); font-family: inherit;
  transition: color .15s ease, background .15s ease;
}
.tabbar button .ico svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--brand); background: color-mix(in srgb, var(--brand) 9%, transparent); }

/* ------------------------------------------------------------ lesson sheet */
.lesson {
  position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
  background: var(--bg-2); animation: sheet .26s cubic-bezier(.2, .8, .3, 1);
}
.lesson[hidden] { display: none; }
@keyframes sheet { from { transform: translateY(22px); opacity: .4; } to { transform: none; opacity: 1; } }
.lesson-head {
  display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px;
  border-bottom: 1px solid var(--line); background: var(--bg-2);
}
.lesson-head .icon-btn { width: 34px; height: 34px; border-radius: 10px; }
.lesson-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 800; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson-title small { display: block; font-size: 10.5px; color: var(--text-3); font-weight: 600; }
.steps { display: flex; gap: 4px; padding: 0 16px 10px; background: var(--bg-2); }
.steps i { flex: 1; height: 4px; border-radius: 99px; background: var(--line); transition: background .25s ease; }
.steps i.on { background: var(--brand); }
.steps i.past { background: color-mix(in srgb, var(--brand) 42%, var(--line)); }
.lesson-body { flex: 1; overflow-y: auto; padding: 18px 18px 120px; -webkit-overflow-scrolling: touch; }
.lesson-foot {
  position: sticky; bottom: 0; margin: 0; padding: 12px 18px calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: linear-gradient(180deg, transparent, var(--bg-2) 34%);
  display: flex; gap: 8px; align-items: center;
}
.lesson-foot .btn { flex: 1; }
.step-label { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--brand); margin-bottom: 8px; }

/* step 1 */
.sit {
  background: linear-gradient(150deg, var(--brand-soft), transparent 130%);
  border: 1px solid color-mix(in srgb, var(--brand) 22%, var(--line));
  border-radius: var(--r-md); padding: 13px 14px; margin-bottom: 16px;
}
.sit b { display: block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); margin-bottom: 5px; }
.sit p { margin: 0; font-size: 13px; color: var(--text); line-height: 1.62; }
.kobig { font-size: 24px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.42; margin: 0 0 8px; word-break: keep-all; }
.konote { font-size: 12px; color: var(--text-2); margin: 0 0 18px; }
.mask-hint {
  display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-3);
  border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 10px 12px; margin-bottom: 16px;
}
.mask-hint b { color: var(--text-2); font-weight: 700; flex: none; white-space: nowrap; }
.mask-hint span { flex: 1; min-width: 0; }

.mic-row { display: flex; gap: 8px; }
.mic-row .btn { white-space: nowrap; }
.mic-row .btn.mic { min-width: 0; padding-left: 10px; padding-right: 10px; font-size: 13.5px; }
.mic-row .btn.side { flex: 0 0 104px; padding-left: 8px; padding-right: 8px; font-size: 13px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 14px; padding: 13px 16px; font: inherit; font-weight: 800; font-size: 14px;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .14s ease, background .15s ease, border-color .15s ease;
}
.btn:active { transform: scale(.985); }
.btn svg { width: 18px; height: 18px; }
.btn.primary {
  background: linear-gradient(180deg, #12c68c, #059669); color: #fff; border-color: transparent;
  box-shadow: 0 8px 20px rgba(5, 150, 105, .26);
}
.btn.primary:disabled { opacity: .45; box-shadow: none; }
.btn.ghost { background: transparent; }
.btn.mic { flex: 1; }
.btn.mic.listening { background: var(--bad-soft); border-color: #fecaca; color: #b91c1c; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, .08); } }
.btn.block { width: 100%; }

.typebox { margin-top: 10px; }
.typebox input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 12px; padding: 12px 13px; font: inherit; font-size: 14px; outline: none;
}
.typebox input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent); }

.result { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 13px; }
.result .said { font-size: 11.5px; color: var(--text-2); margin-bottom: 8px; }
.result .said b { color: var(--text); font-weight: 700; }
.marks { font-size: 14px; line-height: 1.7; }
.marks .w { padding: 0 1px; border-radius: 4px; }
.marks .w.ok { color: var(--ok); }
.marks .w.miss { color: #b91c1c; background: var(--bad-soft); text-decoration: underline; text-decoration-style: dotted; }
.mbar { height: 6px; border-radius: 99px; background: var(--line-2); margin: 10px 0 6px; overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 99px; }
.mscore { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--text-2); }
.mscore .num { font-size: 17px; font-weight: 800; }
.fb { margin-top: 9px; font-size: 12px; padding: 9px 11px; border-radius: 10px; background: var(--surface-2); color: var(--text-2); }
.fb.good { background: var(--ok-soft); color: #065f46; }
.fb.mid { background: #fff7e6; color: #92400e; }
.fb.low { background: var(--bad-soft); color: #991b1b; }
html[data-theme="dark"] .fb.good { color: #7ef0c6; }
html[data-theme="dark"] .fb.mid { background: #3b2a12; color: #fbd38d; }
html[data-theme="dark"] .fb.low { color: #fca5a5; }

/* step 2 */
.encard {
  position: relative; border-radius: var(--r-lg); padding: 18px 18px 16px;
  background: linear-gradient(155deg, #0a2239, #0a3340 62%, #0d4a3f);
  color: #f0fbf7; box-shadow: var(--shadow-lg); margin-bottom: 14px;
}
.encard .en { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.5; margin: 0 0 12px; word-break: keep-all; }
.encard .en small { display: block; font-size: 12.5px; font-weight: 500; color: rgba(226, 247, 240, .72); margin-top: 7px; letter-spacing: 0; }
.speed { display: flex; gap: 6px; flex-wrap: wrap; }
.speed button {
  border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .08); color: #eafff7;
  border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 11.5px; font-weight: 800; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
.speed button[aria-pressed="true"] { background: #4ade9f; color: #04241a; border-color: transparent; }
.speed button svg { width: 14px; height: 14px; }

.panel { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px; margin-bottom: 12px; }
.panel h3 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .04em; color: var(--text-3); font-weight: 800; }
.panel p { margin: 0; font-size: 13px; line-height: 1.68; color: var(--text); word-break: keep-all; }
.panel.nuance { border-left: 3px solid var(--brand); }
.panel.nuance p { color: var(--text); }
.mistake { display: grid; gap: 8px; }
.mx { display: flex; gap: 9px; font-size: 12.5px; line-height: 1.55; }
.mx .tag { flex: none; width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 900; margin-top: 1px; }
.mx.bad .tag { background: var(--bad-soft); color: #b91c1c; }
.mx.good .tag { background: var(--ok-soft); color: var(--ok); }
.mx.bad .txt { color: var(--text-3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, #dc2626 55%, transparent); }
.mx.good .txt { color: var(--text); font-weight: 700; }
.why { margin: 10px 0 0; padding-top: 9px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--text-2); line-height: 1.62; }

/* step 3 */
.drill-intro { font-size: 12.5px; color: var(--text-2); margin: 0 0 12px; }
.vcard { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 13px; margin-bottom: 10px; }
.vcard-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 9px; }
.vnum { flex: none; width: 20px; height: 20px; border-radius: 7px; background: var(--brand-soft); color: var(--brand); font-size: 10.5px; font-weight: 900; display: grid; place-items: center; }
.ven { flex: 1; font-size: 14.5px; font-weight: 700; line-height: 1.5; letter-spacing: -0.01em; word-break: keep-all; }
.vko { font-size: 11.5px; color: var(--text-2); margin-left: 28px; }
.vacts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.mini {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2);
  border-radius: 9px; padding: 6px 10px; font: inherit; font-size: 11px; font-weight: 800; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
.mini svg { width: 13px; height: 13px; }
.mini.listening { background: var(--bad-soft); color: #b91c1c; border-color: #fecaca; }
.mini.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

/* step 4 */
.done-wrap { text-align: center; padding: 14px 4px; }
.done-badge {
  width: 76px; height: 76px; margin: 6px auto 14px; border-radius: 50%;
  background: linear-gradient(155deg, #0a2239, #0f766e 60%, #34d399);
  display: grid; place-items: center; color: #eafff7; box-shadow: 0 16px 34px rgba(16, 185, 129, .3);
}
.done-badge svg { width: 34px; height: 34px; }
.done-wrap h2 { font-size: 20px; letter-spacing: -0.03em; margin: 0 0 6px; }
.done-wrap p { font-size: 13px; color: var(--text-2); margin: 0 0 18px; }
.recap { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px; margin-bottom: 14px; }
.recap .rrow { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }
.recap .rrow:last-child { border-bottom: 0; }
.recap .rrow b { color: var(--brand); flex: none; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding-top: 3px; width: 42px; }
.recap .rrow span { color: var(--text); line-height: 1.5; }

/* ------------------------------------------------------------ review */
.review-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }
.review-card h2 { margin: 0 0 6px; font-size: 17px; letter-spacing: -0.02em; }
.review-card p { margin: 0 0 14px; font-size: 12.5px; color: var(--text-2); }
.seg { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin-bottom: 14px; }
.seg button {
  flex: 1; border: 0; background: none; border-radius: 9px; padding: 9px 6px; cursor: pointer;
  font: inherit; font-size: 12px; font-weight: 800; color: var(--text-2);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand); box-shadow: 0 2px 8px rgba(9, 43, 60, .08); }
.quiz-q { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.4; margin: 0 0 4px; word-break: keep-all; }
.quiz-sit { font-size: 12px; color: var(--text-2); margin: 0 0 14px; }
.qmeta { display: flex; justify-content: space-between; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; color: var(--text-3); margin-bottom: 10px; }
.opt {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 13px; padding: 12px 13px; margin-bottom: 8px; font: inherit; font-size: 13.5px;
  color: var(--text); cursor: pointer; line-height: 1.45; transition: border-color .15s ease, background .15s ease;
}
.opt:active { background: var(--surface-2); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); font-weight: 700; }
.opt.wrong { border-color: #f3b4b4; background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.qresult { margin-top: 6px; font-size: 12.5px; color: var(--text-2); }
.score-big { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--brand); }

/* ------------------------------------------------------------ stats */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 13px 10px; text-align: center; }
.stat b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
.stat span { font-size: 10.5px; color: var(--text-2); font-weight: 600; }
.streakbox {
  display: flex; align-items: center; gap: 14px; margin-top: 12px; padding: 15px;
  border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface);
}
.streakbox .big { font-size: 30px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.streakbox .lbl { font-size: 11.5px; color: var(--text-2); }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 74px; margin-top: 10px; padding: 10px 4px 0; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.bars i { display: block; width: 100%; border-radius: 5px 5px 3px 3px; background: color-mix(in srgb, var(--brand) 28%, var(--line-2)); min-height: 3px; }
.bars i.on { background: linear-gradient(180deg, #34d399, #059669); }
.bars span { font-size: 8.5px; color: var(--text-3); font-weight: 700; }
.chprog { margin-top: 10px; }
.chprog .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }
.chprog .row:last-child { border-bottom: 0; }
.chprog .nm { flex: 1; font-weight: 700; }
.chprog .ct { font-size: 11px; color: var(--text-2); font-weight: 700; }
.chprog .track { width: 74px; height: 5px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.chprog .track i { display: block; height: 100%; background: linear-gradient(90deg, #10b981, #6ee7b7); }

/* ------------------------------------------------------------ modal */
.modal { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; }
.modal[hidden] { display: none; }
.modal-bg { position: absolute; inset: 0; background: rgba(4, 18, 28, .48); backdrop-filter: blur(3px); }
.sheet {
  position: relative; width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto;
  background: var(--bg-2); border-radius: 24px 24px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
  box-shadow: var(--shadow-lg); animation: up .25s cubic-bezier(.2, .8, .3, 1);
}
@keyframes up { from { transform: translateY(40px); } to { transform: none; } }
.sheet-grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 4px auto 14px; }
.sheet h2 { font-size: 17px; letter-spacing: -0.02em; margin: 0 0 14px; }
.field { margin-bottom: 16px; }
.field > label { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 800; margin-bottom: 7px; }
.field .hint { font-size: 11.5px; color: var(--text-2); margin: 6px 0 0; line-height: 1.55; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line-2); }
.switch:last-child { border-bottom: 0; }
.switch span { font-size: 13.5px; font-weight: 700; }
.switch small { display: block; font-size: 11px; color: var(--text-2); font-weight: 500; }
.tgl { width: 46px; height: 27px; border-radius: 99px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .18s ease; }
.tgl::after { content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .18s ease; }
.tgl[aria-checked="true"] { background: var(--brand); }
.tgl[aria-checked="true"]::after { transform: translateX(19px); }
textarea {
  width: 100%; min-height: 92px; border: 1px solid var(--line); border-radius: 12px; padding: 11px;
  font: inherit; font-size: 11.5px; background: var(--surface); color: var(--text); resize: vertical; line-height: 1.5;
}
.danger { color: #b91c1c; border-color: #f3c7c7; }
.small { font-size: 11px; color: var(--text-3); line-height: 1.6; margin: 8px 0 0; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 26px); transform: translate(-50%, 12px);
  z-index: 90; max-width: 86vw; padding: 11px 16px; border-radius: 12px;
  background: #0a2239; color: #eafff7; font-size: 12.5px; font-weight: 600; line-height: 1.45;
  box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 640px) {
  .lesson { max-width: 560px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .tabbar { max-width: 560px; margin: 0 auto; border-radius: 0; }
  .kobig { font-size: 27px; }
}

o":"더 큰 걱정거리가 있어."},{"en":"Let's not get into that right now.","ko":"그건 지금 얘기하지 말자."},{"en":"That's the least of our problems.","ko":"그건 우리 문제 중에 제일 작은 거야."}]},{"n":6,"title":"친구라고 해서 생각이 항상 같아야 하는 건 아니지","situation":"친구끼리 의견이 다른 걸 두고 한쪽이 서운해할 때","ko":"친구라고 해서 생각이 항상 같아야 하는 건 아니지","en":"Just because she's your friend doesn't mean you always have to agree with her.","nuance":"Just because A doesn't mean B는 'A라고 해서 B인 건 아니다'라는 통째로 외워야 하는 틀입니다. agree with는 사람·의견에 동의, agree to는 제안·조건에 동의. 이 전치사 하나로 뜻이 갈려요.","mistake":{"x":"Even though you are friends, you don't have to think same.","o":"Just because you're friends doesn't mean you have to agree on everything.","why":"think same은 영어에 없는 조합이고, even though는 '비록 ~지만'이라 뉘앙스가 다릅니다. '~라고 해서'는 just because로 받아요."},"variants":[{"en":"Just because you're friends doesn't mean you have to agree on everything.","ko":"친구라고 모든 것에 동의해야 하는 건 아니야."},{"en":"That doesn't mean she always has to agree with you.","ko":"그렇다고 걔가 항상 너한테 맞춰야 하는 건 아니야."},{"en":"Just because it's cheap doesn't mean it's bad.","ko":"싸다고 해서 나쁜 건 아니야."},{"en":"It's not like he knows what he's doing.","ko":"걔가 뭘 알고 그러는 게 아니잖아."}]},{"n":7,"title":"간당간당할 줄은 알았는데 끝낼 수 있을 줄 알았어","situation":"마감이 아슬아슬했지만 어찌어찌 끝낼 거라 믿었던 일을 돌아볼 때","ko":"간당간당할 줄은 알았는데 난 그래도 그때까지는 끝낼 수 있을 줄 알았어","en":"I knew I would be cutting it close, but I still thought I could finish it by then.","nuance":"cut it close는 시간이나 여유를 '아슬아슬하게 자른다'는 그림입니다. would be cutting으로 진행형을 쓰면 '그 순간 내내 아슬아슬할 걸 알고 있었다'는 느낌이 살아요. 명사로는 a close call(큰일 날 뻔함).","mistake":{"x":"I knew it would be dangerous but I thought I could finish.","o":"I knew I would be cutting it close.","why":"dangerous는 '위험한'이라 시간이 촉박한 상황과 결이 다릅니다. 이럴 때 쓰는 고정 표현이 cut it close예요."},"variants":[{"en":"I knew it was going to be tight, but I thought I'd make it.","ko":"빡빡할 줄 알았는데 해낼 줄 알았어."},{"en":"I'm cutting it close, but I'll make it.","ko":"아슬아슬하지만 될 거야."},{"en":"That was a close call.","ko":"큰일 날 뻔했어."},{"en":"We're cutting it too close.","ko":"너무 아슬아슬해."}]},{"n":8,"title":"나도 그거 당해 봤어","situation":"상대가 겪은 황당한 일을 듣고 공감할 때","ko":"나도 그거 당해 봤어","en":"I've had that happen to me too.","nuance":"have + 목적어 + 동사원형(happen)으로 '그런 일이 나에게 일어나게 겪었다'는 수동적 경험을 만듭니다. 질문으로도 자주 써요. Have you had this happen to you too? 한 발 물러서 사실만 말할 땐 That's happened to me too.","mistake":{"x":"I was also hit by that.","o":"I've had that happen to me too.","why":"hit은 물리적으로 맞은 느낌이라 일상적인 '당하다'와 다릅니다. 경험은 have + 목적어 + 동사원형으로 담아요."},"variants":[{"en":"That's happened to me too.","ko":"나도 그런 적 있어."},{"en":"Have you had this happen to you too?","ko":"너도 이런 일 겪어 봤어?"},{"en":"I've had that happen to me more than once.","ko":"나도 그거 한두 번 당한 게 아니야."},{"en":"It's happened to all of us.","ko":"우리 모두 겪는 일이야."}]},{"n":9,"title":"어쩐지 뭔가 안 맞는다 했어","situation":"설명을 듣고 나서야 앞뒤가 안 맞았던 이유를 알았을 때","ko":"어쩐지 뭔가 안 맞는다 했어","en":"No wonder I knew something didn't add up.","nuance":"No wonder는 '어쩐지 ~더라'. add up은 숫자나 이야기가 '맞아떨어지다'입니다. 감정이 이상했다는 쪽이면 something didn't feel right, 전체가 이제 이해된다면 It all adds up now.","mistake":{"x":"I thought something is not correct.","o":"No wonder I knew something didn't add up.","why":"'안 맞는다'는 correct(정확하다)가 아니라 add up(계산이 맞다)이나 feel right(느낌이 맞다)으로 표현해요."},"variants":[{"en":"No wonder something felt off.","ko":"어쩐지 뭔가 이상하더라."},{"en":"Something didn't add up.","ko":"뭔가 앞뒤가 안 맞았어."},{"en":"It all adds up now.","ko":"이제 다 맞아떨어지네."},{"en":"Something doesn't feel right about this.","ko":"이거 뭔가 이상해."}]},{"n":10,"title":"오, 이런 기능도 생겼네","situation":"익숙한 앱이나 기기에 새로운 기능이 생긴 걸 발견했을 때","ko":"오, 이런 기능도 생겼네","en":"Looks like they've added a new feature.","nuance":"Looks like는 '보아하니 ~인 것 같다'. they는 기능을 만든 불특정한 사람들입니다. have added(완료)를 쓰는 이유는 과거에 추가했지만 지금 이 자리에 그 기능이 있기 때문이에요. 기기를 주어로 하면 It looks like it's gotten a new feature.","mistake":{"x":"Oh, this function is newly made.","o":"Looks like they've added a new feature.","why":"function은 수학적 기능에 가깝고, 앱의 기능은 feature입니다. newly made는 '새로 제작됐다'라서 방금 생긴 변화의 느낌이 없어요."},"variants":[{"en":"It looks like it's got a new feature.","ko":"새 기능이 생긴 것 같아. (기기가 주어)"},{"en":"It looks like it's learned a new trick.","ko":"뭔가 새로운 걸 배운 모양이야. (귀엽게)"},{"en":"I can do this now.","ko":"와, 이제 이런 것도 되네."},{"en":"They must have updated it.","ko":"업데이트했나 봐."}]},{"n":11,"title":"연락할게","situation":"헤어지기 전, 방법을 정하지 않고 '나중에 연락하겠다'고 말할 때","ko":"연락할게","en":"I'll be in touch.","nuance":"전화인지 메일인지 정하지 않은 '연락할게'는 be in touch입니다. 방법을 정하면 I'll get in touch with you by email처럼 붙여요. contact는 타동사라서 contact to you가 아니라 contact you.","mistake":{"x":"I'll contact to you.","o":"I'll be in touch.","why":"contact 뒤에 to를 붙이면 틀립니다. contact you 또는 be in touch로 써요."},"variants":[{"en":"I'll be in touch soon.","ko":"곧 연락할게."},{"en":"I'll get in touch with you by email.","ko":"이메일로 연락할게."},{"en":"Let's stay in touch.","ko":"계속 연락하고 지내자."},{"en":"I'll let you know as soon as I hear back.","ko":"회신 오는 대로 알려줄게."}]}],"extras":[{"en":"This will have to do for now.","ko":"이걸로 버텨봐야겠다. (임시로 이 정도면 되겠다)"},{"en":"Did you bring something to change into?","ko":"갈아입을 거 가져왔어?"},{"en":"I've never seen anybody do it like that before.","ko":"저렇게 하는 사람 처음 보네."},{"en":"I have some time to kill right now anyway.","ko":"나 어차피 지금 시간 좀 남아."},{"en":"Don't tell me this happened again.","ko":"설마 또 이런 일이 생긴 거야?"},{"en":"I don't like this place. Let's go.","ko":"여기 마음에 안 들어. 가자."},{"en":"I feel like I've been more than patient.","ko":"난 충분히, 그 이상으로 참은 것 같아."},{"en":"I think I've had enough.","ko":"나 이제 됐어. 더는 못 참아."},{"en":"I'm not putting up with it anymore.","ko":"이제 더는 못 참겠어."},{"en":"Will this do?","ko":"이거면 되겠어?"},{"en":"I'm not asking for a lot.","ko":"내가 많은 걸 바라는 게 아니잖아."},{"en":"It was the hardest decision I ever had to make.","ko":"살면서 가장 힘들었던 결정이었어요."}]},{"id":"c2","name":"영어 뇌 깨우기 ②","subtitle":"일상의 상황과 감정 — 말투의 온도를 맞추는 표현","tagline":"같은 뜻도 어떤 단어를 고르느냐에 따라 다정하게도, 퉁명스럽게도 들립니다. 상황에 맞는 온도를 익혀 보세요.","units":[{"n":1,"title":"설마 또 잃어버린 거야?","situation":"물건을 자꾸 잃어버리는 사람이 또 그랬을 것 같아 물을 때","ko":"설마 또 잃어버린 거야?","en":"Don't tell me you lost it again.","nuance":"Don't tell me ~는 '설마 ~인 건 아니지'라는 놀람·체념의 표현입니다. 상대가 말하기 전에 먼저 결론을 던져 버리는 느낌이에요. '말하지 마'라는 금지가 아니니 말투에 주의하세요.","mistake":{"x":"Really again lost?","o":"Don't tell me you lost it again.","why":"한국어 어순을 그대로 옮기면 영어가 되지 않습니다. '설마'는 Don't tell me로 문장 앞에 붙여요."},"variants":[{"en":"Don't tell me this happened again.","ko":"설마 또 이런 일이 생긴 거야?"},{"en":"Don't tell me you forgot.","ko":"설마 잊어버린 거야?"},{"en":"You didn't lose it again, did you?","ko":"또 잃어버린 거 아니지?"},{"en":"I can't believe this is happening again.","ko":"또 이런 일이 생기다니."}]},{"n":2,"title":"별일 아니면 좋겠다","situation":"상대가 몸이 안 좋다거나 문제가 생겼다는 말을 들었을 때","ko":"별일 아니야 될 텐데","en":"I hope it isn't anything serious.","nuance":"'심각한 것'은 anything serious. I hope 뒤에 현재형(isn't)을 쓰면 지금 벌어진 일이 별일 아니길 바란다는 뜻이 됩니다. 가볍게 안심시킬 땐 It's probably nothing.","mistake":{"x":"I hope it is not big thing.","o":"I hope it isn't anything serious.","why":"'큰일'을 big thing으로 옮기면 어색합니다. 심각도는 serious로 말해요."},"variants":[{"en":"I hope it's nothing serious.","ko":"별일 아니길 바라."},{"en":"It's probably nothing.","ko":"아마 별일 아닐 거야."},{"en":"Let's hope it's not serious.","ko":"심각한 거 아니길 바라자."},{"en":"I'm sure it's nothing.","ko":"분명 별일 아닐 거야."}]},{"n":3,"title":"전 여기가 좋아요","situation":"새로 온 곳에서 '여기 마음에 드세요?'라고 물었을 때","ko":"전 여기가 좋아요","en":"I like it here.","nuance":"here는 부사처럼 보이지만 like의 목적어 자리에 it을 먼저 두고 here를 붙입니다. like here라고 하면 틀려요. '점점 좋아진다'는 This place is growing on me.","mistake":{"x":"I like here.","o":"I like it here.","why":"like는 목적어가 필요한 동사라서 it이 있어야 합니다. here는 그 뒤에 붙는 위치 표현이에요."},"variants":[{"en":"I like working here.","ko":"여기서 일하는 게 좋아요."},{"en":"I don't really like it here.","ko":"여기는 별로 마음에 안 들어요."},{"en":"This place is growing on me.","ko":"이 곳이 점점 좋아지네요."},{"en":"I could get used to this.","ko":"이거 익숙해질 것 같아요."}]},{"n":4,"title":"여기 사람들은 다들 저한테 잘해 줘요","situation":"새 직장이나 새 동네 사람들이 친절하다고 말할 때","ko":"여기 사람들은 다들 저한테 잘해 줘요","en":"Everyone here treats me nice.","nuance":"treat + 사람 + 형용사(nice)로 '대하다'의 결과 상태를 말합니다. treat me nicely도 맞지만 회화에서는 nice가 자연스러워요. 수동으로 Everyone here is really nice to me도 자주 씁니다.","mistake":{"x":"Everyone here does me well.","o":"Everyone here treats me nice.","why":"do me well은 '나를 잘 돌본다'는 다른 뜻으로 들립니다. 사람을 대하는 태도는 treat를 써요."},"variants":[{"en":"Everyone here is really nice to me.","ko":"여기 사람들 모두 저한테 정말 잘해 줘요."},{"en":"They treat me like family.","ko":"가족처럼 대해 줘요."},{"en":"People here are friendly.","ko":"여기 사람들은 친절해요."},{"en":"Everyone's been very kind to me.","ko":"모두 저한테 아주 잘해 주셨어요."}]},{"n":5,"title":"이거 킴한테 꼭 좀 전해 줄래?","situation":"중요한 서류나 물건을 반드시 그 사람 손에 들어가게 해 달라고 부탁할 때","ko":"이거 킴한테 꼭 좀 전해 줄래?","en":"Could you please make sure Kim gets this?","nuance":"make sure + 사람 + gets + 물건은 '킴이 이걸 받도록 확실히 해 줘'라는 틀입니다. give it to Kim은 단순 전달이지만, make sure가 들어가면 '꼭 챙겨 달라'는 책임이 붙어요.","mistake":{"x":"Could you please give Kim this for sure?","o":"Could you please make sure Kim gets this?","why":"for sure는 '확실히'라는 부사로 문장 끝에 쓰지만, '확실히 해 달라'는 부탁은 make sure로 동사를 만들어야 합니다."},"variants":[{"en":"Could you make sure Kim gets this?","ko":"킴한테 이거 꼭 전달해 줄래?"},{"en":"Can you pass this on to Kim?","ko":"이거 킴한테 전달해 줄 수 있어?"},{"en":"Please make sure this gets to Kim.","ko":"이게 꼭 킴에게 전달되게 해 주세요."},{"en":"Would you mind giving this to Kim?","ko":"이거 킴한테 좀 전해 주시겠어요?"}]},{"n":6,"title":"난 충분히 참은 거 같아","situation":"더는 참기 어려워서 한계를 이야기할 때","ko":"난 충분히 참은 거 같아","en":"I feel like I've been patient enough.","nuance":"feel like + 절은 '내 느낌엔 ~인 것 같다'. have been patient(완료)로 지금까지 참아 온 상태를 담고, enough가 '이제 한계'라는 신호를 보냅니다. 더 강하게는 I've had enough.","mistake":{"x":"I think I waited enough.","o":"I feel like I've been patient enough.","why":"wait는 물리적으로 기다린 것, patient는 참고 견딘 태도입니다. 감정의 한계를 말할 땐 patient를 써요."},"variants":[{"en":"I feel like I've been more than patient.","ko":"난 충분히, 그 이상으로 참은 것 같아."},{"en":"I think I've had enough.","ko":"나 이제 됐어."},{"en":"I've been patient long enough.","ko":"충분히 참았어."},{"en":"I'm not putting up with it anymore.","ko":"이제 더는 못 참겠어."}]},{"n":7,"title":"그 사람이 뭘 했길래 사람들이 그렇게 화가 난 거야?","situation":"모두가 화가 났는데 이유를 모를 때, 원인을 캐물을 때","ko":"그 사람이 뭘 했길래 사람들이 그렇게 화가 난 거야?","en":"What did he do that got people so mad?","nuance":"What did he do that ~은 '무엇을 했길래 ~하게 만들었나'라는 인과 질문입니다. get + 사람 + 형용사(mad)는 '~하게 만들다'. make people mad와 비슷하지만 get은 감정이 옮겨 붙는 느낌이에요.","mistake":{"x":"What did he do and people are so angry?","o":"What did he do that got people so mad?","why":"and로 두 문장을 이으면 인과가 드러나지 않습니다. that절로 '~하게 만든' 결과를 붙여요."},"variants":[{"en":"What did he do to make people so mad?","ko":"걔가 뭘 해서 사람들을 그렇게 화나게 한 거야?"},{"en":"What did she say that upset everyone?","ko":"걔가 뭐라고 해서 다들 속상하게 한 거야?"},{"en":"How did that get everyone so angry?","ko":"그게 어떻게 다들 그렇게 화나게 만든 거야?"},{"en":"What set them off like that?","ko":"뭐가 그렇게 건드린 거야?"}]},{"n":8,"title":"업자 불러서 창문 하나내는 거 어떨까?","situation":"집의 오래된 문제를 두고 함께 해결책을 꺼낼 때","ko":"우리 화장실 벽에 여름마다 곰팡이 피잖아. 우리 그냥 업자 불러서 거기 창문 하나내는 거 어떨까?","en":"You know how our bathroom walls collect mold every summer. What if we hired a contractor and just put a window in there?","nuance":"You know how ~는 '있잖아, 우리 ~하잖아'라며 둘 다 아는 배경을 꺼내는 말입니다. What if we + 과거형은 '~하면 어떨까'라는 부드러운 제안. 과거형을 쓰는 이유는 아직 일어나지 않은 일이라서 그래요.","mistake":{"x":"Our bathroom has mold every summer. How about hire a contractor?","o":"You know how our bathroom walls collect mold every summer. What if we hired a contractor?","why":"How about 뒤에는 동명사(hiring)가 와야 하고, 공유된 배경을 꺼낼 땐 You know how가 훨씬 자연스럽습니다."},"variants":[{"en":"You know how the walls get moldy every summer?","ko":"우리 벽이 여름마다 곰팡이 슨 거 알지?"},{"en":"What if we just put a window in there?","ko":"거기에 창문 하나 내면 어떨까?"},{"en":"Maybe we should hire a contractor.","ko":"업자를 부르는 게 나을 것 같아."},{"en":"Why don't we get someone to take a look?","ko":"누구 불러서 한번 보게 하는 게 어때?"}]},{"n":9,"title":"저렇게 하는 사람 처음 보네","situation":"남들이 안 하는 방식으로 무언가를 하는 사람을 보고","ko":"저렇게 하는 사람 처음 보네","en":"I've never seen anybody do it like that before.","nuance":"never + 현재완료 + before가 한 세트로 '지금까지 한 번도'를 만듭니다. anybody do it은 목적격 뒤에 동사원형이 오는 구조. anybody 대신 anyone도 같아요.","mistake":{"x":"I see first person who does like that.","o":"I've never seen anybody do it like that before.","why":"'처음 보네'는 first로 시작하지 않고 never ... before로 표현합니다. 경험을 말할 땐 현재완료가 기본이에요."},"variants":[{"en":"I've never seen anyone do that before.","ko":"그런 거 하는 사람 처음 봐."},{"en":"That's a first for me.","ko":"나는 처음 보는 거야."},{"en":"I've never seen it done like that.","ko":"저런 방식으로 하는 건 처음 봐."},{"en":"Nobody does it like that.","ko":"아무도 저렇게 안 해."}]},{"n":10,"title":"나 어차피 시간 좀 남아","situation":"상대가 미안해하며 시간을 물을 때, 괜찮다고 말할 때","ko":"나 어차피 시간 좀 남아","en":"I have some time to kill right now anyway.","nuance":"time to kill은 '죽일 시간'이 아니라 남는 시간을 어떻게든 보내야 하는 상황. anyway가 붙으면 '어차피'라서 상대의 부담을 덜어 줍니다.","mistake":{"x":"I have some time anyway.","o":"I have some time to kill right now anyway.","why":"시간이 남는다는 여유를 살리려면 to kill을 붙입니다. 그냥 some time이면 '시간이 좀 있다'로만 들려요."},"variants":[{"en":"I've got some time to kill anyway.","ko":"어차피 시간 좀 남아."},{"en":"I have time to spare.","ko":"시간 여유 있어."},{"en":"I'm free right now anyway.","ko":"어차피 지금 한가해."},{"en":"I've got nothing else to do.","ko":"딱히 할 일도 없어."}]},{"n":11,"title":"신경 쓰지 마 vs 걱정하지 마","situation":"상대가 사과하거나, 걱정하고 있을 때","ko":"신경 쓰지 마 / 걱정하지 마","en":"No worries. / Don't worry.","nuance":"No worries는 상대의 사과·감사에 가볍게 응답하는 말('별거 아니야'). Don't worry는 걱정하는 사람을 진정시키는 말입니다. 무엇에 반응하느냐가 둘을 갈라요.","mistake":{"x":"Don't mind it.","o":"No worries.","why":"Don't mind it은 영어에서 거의 쓰지 않습니다. 사과에 답할 땐 No worries가 자연스러워요."},"variants":[{"en":"No worries.","ko":"별거 아니야."},{"en":"Don't worry about it.","ko":"그거 걱정하지 마."},{"en":"It's no big deal.","ko":"별일 아니야."},{"en":"You're fine, seriously.","ko":"괜찮아, 진짜로."}]}],"extras":[{"en":"It's not ideal, but it's better than doing nothing.","ko":"이상적이진 않지만 아무것도 안 하는 것보단 낫지."},{"en":"Hey, it's just a phase. Don't worry about it. It's going to get better.","ko":"에이, 그냥 과정일 뿐이야. 걱정 마, 나아질 거야."},{"en":"There wasn't a problem per se.","ko":"딱히 문제가 있었다기보다는."},{"en":"I wanted to fit in quickly, so I couldn't help answering their questions.","ko":"빨리 적응하고 싶어서 어쩔 수 없이 대답을 하긴 했는데."},{"en":"I gotta say I didn't feel very comfortable.","ko":"솔직히 좀 불편하더라고."},{"en":"There wasn't particularly a problem, it's just that people asked surprisingly very private questions like it was nothing.","ko":"딱히 문제가 있었다기보다는, 사람들이 놀랍게도 아무것도 아닌 것처럼 아주 사적인 질문을 했다는 거예요."},{"en":"I hope you find this helpful.","ko":"이게 도움이 됐으면 좋겠어요."},{"en":"I will be rooting for you.","ko":"응원할게."},{"en":"What's up?","ko":"뭐 해? / 무슨 일이야?"}]},{"id":"c3","name":"핵심 동사","subtitle":"have · get · used to · should have — 뼈대를 바꾸면 문장이 늘어난다","tagline":"원어민이 하루에도 수십 번 쓰는 동사 틀만 잡아도 표현이 확 늘어납니다. 같은 뼈대로 주어와 대상을 바꿔 말해 보세요.","units":[{"n":1,"title":"할 게 좀 있어","situation":"약속을 거절하며 이유를 가볍게 말할 때","ko":"할 게 좀 있어","en":"I have something to do.","nuance":"have + something / nothing / a lot + to do. '할 것'이라는 명사 뒤에서 to부정사가 꾸며 주는 틀입니다. something은 '좀', a lot은 '많이', nothing은 '아무것도 없이'로 양을 바꿔 끼우면 그대로 문장이 됩니다.","mistake":{"x":"I have a thing to do.","o":"I have something to do.","why":"a thing은 '물건 하나'처럼 들립니다. 막연한 '뭔가'는 something이에요."},"variants":[{"en":"I have a lot to do.","ko":"할 게 많아."},{"en":"I have nothing to do.","ko":"할 게 없어."},{"en":"I have something important to do.","ko":"중요한 일이 좀 있어."},{"en":"Do you have anything to do today?","ko":"오늘 할 일 있어?"}]},{"n":2,"title":"같이 연습할 사람이 없어","situation":"같이 해 줄 사람이 없어서 못 하고 있다고 말할 때","ko":"같이 연습할 사람이 없어","en":"I have no one to practice with.","nuance":"practice with someone의 with가 문장 끝에 남습니다. '사람이 없다'를 no one으로 앞세우고, 그 사람과 무엇을 하는지를 to practice with로 뒤에 붙이는 구조예요. talk to, worry about도 똑같이 전치사가 남습니다.","mistake":{"x":"There is no person to practice.","o":"I have no one to practice with.","why":"no person은 어색하고, practice 뒤의 with를 빠뜨리면 '연습할 사람'이 아니라 '연습할 대상'이 됩니다."},"variants":[{"en":"I have no one to talk to.","ko":"얘기할 사람이 없어."},{"en":"I have a lot of people to talk to.","ko":"얘기할 사람이 많아."},{"en":"I don't have anyone to practice with.","ko":"같이 연습할 사람이 없어."},{"en":"Who do you practice with?","ko":"누구랑 연습해?"}]},{"n":3,"title":"우리는 할 얘기가 많았어","situation":"오랜만에 만난 사람과 이야기가 길게 이어졌을 때","ko":"우리는 할 얘기가 많았어","en":"We had a lot to talk about.","nuance":"과거 had로 바꾸면 '그때 할 얘기가 많았다'가 됩니다. talk about의 about이 끝에 남고, think about도 같은 방식이에요. 근황 이야기라면 catch up on을 써서 We had a lot to catch up on.","mistake":{"x":"We had many stories to say.","o":"We had a lot to talk about.","why":"story to say는 영어에 없는 조합입니다. '할 얘기'는 talk about으로 받아요."},"variants":[{"en":"We have a lot to think about.","ko":"우리는 생각할 게 많아."},{"en":"We had a lot to catch up on.","ko":"우리는 근황 얘기가 많았어."},{"en":"There's so much to talk about.","ko":"얘기할 게 정말 많아."},{"en":"We need to talk.","ko":"우리 얘기 좀 해야겠어."}]},{"n":4,"title":"걱정할 게 하나도 없어","situation":"불안해하는 사람에게 확실하게 안심시킬 때","ko":"너는 걱정할 게 하나도 없어","en":"You have nothing to worry about.","nuance":"worry about의 about이 남고 nothing이 앞에 옵니다. 주어를 There로 바꾸면 There's nothing to worry about으로 더 일반적인 말이 돼요. What's there to worry about?은 '뭐 걱정할 게 있어?'라는 반문.","mistake":{"x":"You don't have worry things.","o":"You have nothing to worry about.","why":"worry는 동사라서 to부정사로 명사를 꾸며야 합니다. worry things라는 명사 조합은 쓰지 않아요."},"variants":[{"en":"There's nothing to worry about.","ko":"걱정할 거 없어."},{"en":"You've got nothing to worry about.","ko":"걱정할 게 하나도 없어."},{"en":"Don't worry about a thing.","ko":"아무것도 걱정하지 마."},{"en":"What's there to worry about?","ko":"뭐 걱정할 게 있어?"}]},{"n":5,"title":"부끄러워할 게 아무것도 없어","situation":"실수한 사람에게 창피해하지 말라고 말할 때","ko":"부끄러워할 게 아무것도 없어","en":"There is nothing to be ashamed of.","nuance":"be ashamed of는 '부끄러움을 느끼는 상태'. there is nothing to ~ 틀에 그대로 넣으면 '~할 것이 아무것도 없다'가 됩니다. 두려움은 scared of, 두려움의 대상이 있으면 afraid of.","mistake":{"x":"There is nothing to shame.","o":"There is nothing to be ashamed of.","why":"shame은 '부끄럽게 만들다'(타동사)라서 주어가 부끄러워하는 상황엔 be ashamed를 씁니다."},"variants":[{"en":"There's nothing to be ashamed of.","ko":"부끄러워할 것 없어."},{"en":"There's nothing to be scared of.","ko":"무서워할 것 하나도 없어."},{"en":"There's nothing to be afraid of.","ko":"두려워할 것 없어."},{"en":"You have nothing to be ashamed of.","ko":"넌 부끄러워할 게 없어."}]},{"n":6,"title":"기대할 게 정말 많아","situation":"앞으로 있을 일이 즐거워서 들뜬 마음을 말할 때","ko":"기대할 게 정말 많아","en":"There is so much to look forward to.","nuance":"look forward to는 '앞을 내다보며 기대하다'. to가 전치사라서 뒤에 명사나 동명사가 옵니다. I'm looking forward to it이 가장 흔한 인사말 형태예요.","mistake":{"x":"There is much to expect.","o":"There is so much to look forward to.","why":"expect는 '예상하다'라서 설렘이 없습니다. 즐거운 기대는 look forward to예요."},"variants":[{"en":"There's so much to look forward to.","ko":"기대할 게 정말 많아."},{"en":"I'm looking forward to it.","ko":"기대하고 있어."},{"en":"I can't wait.","ko":"빨리 보고 싶어."},{"en":"There's a lot to look forward to.","ko":"기대할 게 많아."}]},{"n":7,"title":"좋은 장소를 많이 가볼 수 있었어","situation":"여행이나 일에서 운 좋게 좋은 기회를 가졌을 때","ko":"몇 년 전 아이슬란드에 갔을 때 아름다운 장소를 많이 가볼 수 있었다","en":"When I was in Iceland a few years ago, I got to visit a lot of beautiful locations.","nuance":"get to + 동사는 '기회가 있어 ~하게 되다'. 즐거운 기회에 씁니다. 의무인 had to와 정반대라서, 같은 문장에서 I had to work but I got to meet people처럼 대비시키면 뜻이 선명해져요.","mistake":{"x":"I could visit a lot of beautiful places.","o":"I got to visit a lot of beautiful locations.","why":"could는 능력이나 가능성이라 감흥이 없습니다. '운 좋게 해봤다'는 get to가 그 느낌을 담아요."},"variants":[{"en":"I get to set my own work schedule.","ko":"내 근무 일정을 내가 짤 수 있어."},{"en":"I got to meet a lot of different people.","ko":"다양한 사람들을 많이 만날 수 있었어."},{"en":"I got to try a lot of unusual food.","ko":"신기한 음식을 많이 먹어볼 수 있었어."},{"en":"I never get to see you anymore.","ko":"요즘 널 볼 기회가 없네."}]},{"n":8,"title":"학교 끝나고 바로 집에 못 갔어","situation":"하고 싶었지만 기회가 없어서 못 했던 일을 말할 때","ko":"학교 끝나고 바로 집으로 가지 못했어","en":"I didn't get to go home right after school.","nuance":"didn't get to는 '기회가 없어서 못 했다'입니다. couldn't(능력·상황상 불가)와 미묘하게 다르고, 아쉬움이 배어 있어요. 질문은 Did you get to ~?로 '~할 기회 있었어?'","mistake":{"x":"I couldn't go home because no chance.","o":"I didn't get to go home right after school.","why":"chance를 문장에 억지로 붙이지 않아도 get to 하나로 '기회가 없어서 못 했다'가 됩니다."},"variants":[{"en":"We didn't get to ask any questions.","ko":"질문은 하나도 못 했어."},{"en":"I didn't get to do a lot of things.","ko":"하고 싶은 걸 많이 못 했어."},{"en":"I never got to say goodbye.","ko":"작별 인사를 못 했어."},{"en":"Did you get to see him?","ko":"그 사람 만날 기회 있었어?"}]},{"n":9,"title":"새 직장에 적응하는 중이야","situation":"새 환경에 익숙해지는 과정을 말할 때","ko":"나는 새 직장에 적응하는 중이에요","en":"I'm getting used to my new job.","nuance":"세 가지를 구분하세요. be used to + 명사/동명사 = 익숙하다, get used to = 익숙해지다(변화 중), used to + 동사원형 = 예전에 ~했다(지금은 아님). 전치사 to 뒤에는 반드시 명사나 동명사가 옵니다.","mistake":{"x":"I'm getting used to work at my new job.","o":"I'm getting used to working at my new job.","why":"여기 to는 전치사라서 동사원형이 아니라 동명사(working)가 와야 합니다."},"variants":[{"en":"I'm used to working under pressure.","ko":"나는 압박 속에서 일하는 것에 익숙해."},{"en":"She's getting used to waking up early.","ko":"그녀는 일찍 일어나는 것에 적응하는 중이야."},{"en":"He's used to the cold weather.","ko":"그는 추운 날씨에 익숙해."},{"en":"They're used to the new system now.","ko":"그들은 이제 새 시스템에 익숙해졌어."}]},{"n":10,"title":"예전엔 주말마다 축구를 했는데","situation":"지금은 하지 않는 옛 습관을 이야기할 때","ko":"예전에는 주말마다 축구를 했지만, 지금은 시간이 없어","en":"I used to play soccer every weekend, but now I don't have time.","nuance":"used to + 동사원형은 '예전에는 ~했다(지금은 아니다)'. 과거형과 달리 '지금은 안 한다'는 대비가 자동으로 담깁니다. I never used to be like this는 '예전엔 안 그랬는데'.","mistake":{"x":"I was playing soccer every weekend before.","o":"I used to play soccer every weekend.","why":"과거진행은 그때 하고 있었다는 장면일 뿐, '지금은 안 한다'는 뜻이 없습니다. 옛 습관은 used to예요."},"variants":[{"en":"She used to live in New York.","ko":"그녀는 예전에 뉴욕에 살았어."},{"en":"I never used to be like this.","ko":"예전에는 안 그랬는데."},{"en":"I didn't use to like coffee.","ko":"예전엔 커피를 안 좋아했어."},{"en":"Things used to be different.","ko":"예전엔 달랐는데."}]},{"n":11,"title":"어제 바로 자지 말걸","situation":"지난 일을 후회하며 '그때 그렇게 하지 말았어야 했는데'라고 말할 때","ko":"어제 바로 자지 말걸. 그랬으면 아침에 그렇게 바쁘지 않았을 텐데","en":"I shouldn't have gone straight to bed. Then, I wouldn't have been so busy this morning.","nuance":"should have + 과거분사는 '~했어야 했는데(안 했다)'는 후회, shouldn't have는 '~하지 말았어야 했는데(했다)'. 발음은 should've, wouldn't have는 '워른해브'처럼 뭉개집니다. Then 이하도 가정법 과거완료예요.","mistake":{"x":"I should not go to bed straight.","o":"I shouldn't have gone straight to bed.","why":"이미 지난 일에 대한 후회라서 should have + 과거분사가 필요합니다. should not go는 앞으로의 일을 말해요."},"variants":[{"en":"I should've done my work.","ko":"내 일을 끝냈어야 했는데."},{"en":"I should have known.","ko":"그럴 줄 알았어야 했는데."},{"en":"I shouldn't have said that.","ko":"그 말 하지 말았어야 했는데."},{"en":"I could be wrong.","ko":"내가 틀렸을 수도 있어."}]}],"extras":[{"en":"I think one of the most interesting things about teaching English is that I get to meet a lot of different people.","ko":"영어를 가르치면서 가장 흥미로운 점 중 하나는 다양한 사람들을 많이 만날 수 있다는 것이다."},{"en":"When I was little, both of my parents had to work. So, I didn't get to go home right after school.","ko":"어렸을 때 부모님이 둘 다 일을 하셔서 학교 끝나고 바로 집에 가지 못했어요."},{"en":"When I was in high school, I spent one vacation with my grandfather and I got to see what it was like to be a farmer.","ko":"고등학생 때 방학에 할아버지와 지내며 농부로 사는 게 어떤지 볼 수 있었어요."},{"en":"When she was in college, she had to work when she wasn't studying.","ko":"그녀는 대학생 때 공부하지 않을 땐 일을 해야 했어요."},{"en":"She gave a really good presentation. We got to learn a lot about raising children. We didn't get to ask any questions, though.","ko":"그녀는 정말 좋은 발표를 했어요. 육아에 대해 많이 배웠지만 질문은 못 했어요."},{"en":"When I was studying in China, I got to try a lot of very unusual food.","ko":"중국에서 공부할 때 신기한 음식을 많이 먹어볼 수 있었어요."},{"en":"It could be that he's just tired.","ko":"그냥 피곤한 것일 수도 있어."},{"en":"There's no particular reason.","ko":"딱히 이유가 있는 건 아니야."},{"en":"I'm confused about what to do.","ko":"뭘 해야 할지 헷갈려."},{"en":"I'm confused by all these options.","ko":"이 많은 선택지 때문에 헷갈려."},{"en":"I'm not very used to this.","ko":"전 이거에 아주 익숙하지 않아요."},{"en":"I'm not used to spicy food.","ko":"나는 매운 음식이 익숙하지 않아요."},{"en":"As a freelancer, I get to set my own work schedule.","ko":"프리랜서로서 내 근무 일정을 내가 짤 수 있다."},{"en":"I'm interested in this.","ko":"이거에 관심 있어."},{"en":"I'm prepared to take the risk.","ko":"위험을 감수할 준비가 되어 있어."},{"en":"I'm scared of heights.","ko":"나는 높은 곳이 무서워."},{"en":"I'm worried about the schedule.","ko":"일정이 걱정돼."},{"en":"I'm addicted to this game.","ko":"나 이 게임에 중독됐어."},{"en":"A major obstacle to learning English is not having enough time to practice every day.","ko":"영어 학습의 가장 큰 걸림돌은 매일 연습할 시간이 없다는 것이다."},{"en":"I'm always more productive when I work in the morning rather than late at night.","ko":"나는 늦은 밤보다 아침에 일할 때 늘 더 생산적이다."},{"en":"To see real progress at the gym, you have to be consistent with your workouts.","ko":"헬스장에서 진짜 변화를 보려면 운동을 꾸준히 해야 한다."},{"en":"Yoga helps me feel centered and ready to face the day with a clear mind.","ko":"요가는 마음을 가다듬고 맑은 정신으로 하루를 시작하게 해 준다."}]},{"id":"c4","name":"뉘앙스와 전치사","subtitle":"in / on / with 하나가 뜻을 바꾼다 — 콩글리시 교정","tagline":"아는 단어인데 어색하게 들리는 이유는 대부분 전치사와 짝입니다. 틀린 표현을 먼저 보고 고쳐 보세요.","units":[{"n":1,"title":"이게 어디야","situation":"기대에 못 미치지만 없는 것보단 나을 때","ko":"(그래도) 이게 어디야","en":"It's better than nothing.","nuance":"비교급 than으로 '없는 것보다 낫다'를 만듭니다. 완벽하지 않은 상황을 스스로 달래는 말투예요. '아무것도 안 하는 것보단 낫지'는 It's better than doing nothing.","mistake":{"x":"It's better than nothing is.","o":"It's better than nothing.","why":"than 뒤에는 비교 대상만 옵니다. 절을 붙이지 않아요."},"variants":[{"en":"It's better than doing nothing.","ko":"아무것도 안 하는 것보단 낫지."},{"en":"It's not ideal, but it's better than nothing.","ko":"이상적이진 않지만 없는 것보단 나아."},{"en":"At least it's something.","ko":"그래도 뭔가 하긴 했네."},{"en":"I'll take what I can get.","ko":"되는 대로 받아들일게."}]},{"n":2,"title":"늦게라도 해서 다행이야","situation":"일이 늦어졌지만 아예 안 한 것보다 나을 때","ko":"늦게라도 해서 다행이야","en":"Better late than never.","nuance":"Better A than B는 'B보다 A가 낫다'는 틀인데, 주어와 동사를 생략한 채 관용구로 굳었습니다. 격려할 때도, 스스로를 달랠 때도 씁니다.","mistake":{"x":"Late is better than never do.","o":"Better late than never.","why":"관용구는 형태가 고정되어 있습니다. 풀어 쓰면 오히려 어색해져요."},"variants":[{"en":"Better late than never.","ko":"늦게라도 하는 게 낫지."},{"en":"Better now than later.","ko":"나중보다 지금이 낫지."},{"en":"It's better to be safe.","ko":"안전한 게 il right before the meeting.","ko":"회의 직전에 메일 보냈어."},{"en":"I just sent you an email.","ko":"방금 메일 보냈어."},{"en":"Is it in your spam folder?","ko":"스팸 폴더에 있어?"},{"en":"Check your spam folder.","ko":"스팸함 좀 확인해 봐."}]},{"n":4,"title":"어떻게 진행하기로 하셨어요?","situation":"상대 팀과 논의된 결론을 확인할 때","ko":"어떻게 진행하기로 하셨나요?","en":"How did you guys decide to proceed?","nuance":"proceed는 '진행하다'의 격식체. decide to proceed는 '진행하기로 결정하다'. 캐주얼하게는 Where did you land on this?","mistake":{"x":"How did you decide to go ahead it?","o":"How did you guys decide to proceed?","why":"go ahead는 목적어를 받지 않습니다. '진행하기로 하다'는 decide to proceed로 깔끔하게 써요."},"variants":[{"en":"How did you decide to move forward?","ko":"어떻게 진행하기로 하셨어요?"},{"en":"What did you agree on?","ko":"무엇으로 합의하셨어요?"},{"en":"Where did you land on this?","ko":"이 건 어떻게 정리됐어요?"},{"en":"Which way did you go?","ko":"어느 쪽으로 하셨어요?"}]},{"n":5,"title":"전문 분야가 뭐세요?","situation":"면접이나 첫 미팅에서 상대의 전문성을 물을 때","ko":"전문 분야는 무엇이세요? / 저는 압박 속에서 빛을 발합니다","en":"What's your area of expertise? / I thrive under pressure.","nuance":"expertise는 '전문성'. thrive는 원래 '번성하다'라서 어떤 환경에서 빛을 발한다는 뜻이 됩니다. under pressure는 '압박 속에서'.","mistake":{"x":"What is your special area? / I am strong in pressure.","o":"What's your area of expertise? / I thrive under pressure.","why":"special area는 어색한 조합이고, strong in pressure는 영어에서 쓰지 않습니다."},"variants":[{"en":"What do you specialize in?","ko":"무엇을 전문으로 하세요?"},{"en":"I do my best under pressure.","ko":"저는 압박을 받을 때 최선을 냅니다."},{"en":"I work well under pressure.","ko":"압박 속에서도 잘 일합니다."},{"en":"I thrive in fast-paced environments.","ko":"빠른 환경에서 빛을 발합니다."}]},{"n":6,"title":"맡은 역할을 위해 나서야 했던 사례를 들어 주세요","situation":"면접에서 리더십·주도성을 확인하는 질문","ko":"자신의 역할을 위해 스스로 나서야 했던 사례를 들어주세요","en":"Give me an instance where you had to step up for your role.","nuance":"instance는 '사례'. step up은 '나서서 책임을 지다'. where는 앞의 instance를 꾸미는 관계부사입니다.","mistake":{"x":"Give me an example that you stepped up.","o":"Give me an instance where you had to step up for your role.","why":"example 뒤에는 보통 where나 of ~ing가 옵니다. that절로 붙이면 어색해요."},"variants":[{"en":"Can you give me an example?","ko":"예를 하나 들어 주시겠어요?"},{"en":"Tell me about a time you stepped up.","ko":"앞장섰던 때를 말씀해 주세요."},{"en":"When did you have to take the lead?","ko":"언제 주도해야 했나요?"},{"en":"Give me an instance where you had to step up.","ko":"나서야 했던 사례를 들어 주세요."}]},{"n":7,"title":"고객사 제품 현지화에 문제가 있었습니다","situation":"지난 프로젝트의 어려움을 설명하며 원인을 짚을 때","ko":"고객사 제품을 현지화하는 데 문제가 있었던 적이 있습니다. 미국 기업이 아시아에 진출할 때 자주 생기는 일이죠","en":"There was a time we encountered an issue with localizing a client's product. That tends to happen when American companies try to penetrate Asia.","nuance":"encounter an issue는 '문제를 마주하다'의 격식체. tend to는 '~하는 경향이 있다'. penetrate a market은 '시장에 침투하다·진출하다'.","mistake":{"x":"We met a problem for localizing client product.","o":"We encountered an issue with localizing a client's product.","why":"meet a problem은 콩글리시에 가깝습니다. 문제는 encounter / run into, 전치사는 with를 써요."},"variants":[{"en":"We ran into a localization issue.","ko":"현지화 문제가 생겼어요."},{"en":"We had a problem with the client's product.","ko":"고객사 제품에 문제가 있었어요."},{"en":"That tends to happen when American companies try to penetrate Asia.","ko":"미국 기업이 아시아에 진출할 때 자주 있는 일이에요."},{"en":"That's always a difficult issue to handle.","ko":"그건 늘 다루기 어려운 문제예요."}]},{"n":8,"title":"품질 문제가 가장 중요하시다는 거죠?","situation":"바이어의 요구를 정확히 이해했는지 확인할 때","ko":"품질 문제가 가장 중요하다고 생각하시는 거죠? 제가 맞게 이해했을까요?","en":"It sounds like what's most important to you is the quality issue. Did I understand you correctly?","nuance":"It sounds like ~는 '말씀을 들으니 ~인 것 같습니다'라는 확인의 틀. Did I understand you correctly?는 통화·회의에서 오해를 막는 필수 문장입니다.","mistake":{"x":"You mean quality is most important? Right?","o":"It sounds like what's most important to you is the quality issue. Did I understand you correctly?","why":"Right?만 붙이면 확인이 아니라 압박이 됩니다. 정중한 확인은 Did I understand you correctly?예요."},"variants":[{"en":"I completely understand your concerns about the order and product quality.","ko":"주문과 제품 품질에 대한 우려를 충분히 이해합니다."},{"en":"Can I ask what led you to that conclusion?","ko":"어떻게 그런 결론에 이르셨는지 여쭤봐도 될까요?"},{"en":"Are there other parts of that you'd like me to know about?","ko":"그 외에 제가 알아야 할 부분이 있을까요?"},{"en":"How would you like things to turn out?","ko":"어떻게 해결되길 원하시나요?"}]},{"n":9,"title":"이 문제는 타협할 수 없습니다","situation":"품질 문제에서 선을 분명히 그어야 할 때","ko":"이 문제에 대해서는 타협할 수 없습니다. 색상과 마감은 중대한 결함으로 보고 있습니다","en":"We cannot make any compromises on these issues. I see color and finish issues as major defects.","nuance":"make a compromise on ~은 '~에 타협하다'. see A as B는 'A를 B로 보다'. major defect는 '중대 결함', critical은 '치명적인'으로 강도를 높입니다.","mistake":{"x":"We can't compromise on these issues.","o":"We cannot make any compromises on these issues.","why":"compromise on은 문법적으로 가능하지만, '어떤 타협도 하지 않겠다'는 강한 선언은 make any compromises가 더 분명하게 들립니다."},"variants":[{"en":"I see color and finish issues as major defects.","ko":"색상과 마감 문제를 중대 결함으로 봅니다."},{"en":"Size and weight discrepancies are critical.","ko":"사이즈와 중량 차이는 치명적입니다."},{"en":"We can't compromise on quality.","ko":"품질은 타협할 수 없습니다."},{"en":"Please pay extra attention to the critical ones.","ko":"특히 중요한 부분에 더 신경 써 주세요."}]},{"n":10,"title":"양쪽에 이득이 되는 해결안을 찾을 수 있을 겁니다","situation":"가격·조건 협상에서 문을 열어 두며 마무리할 때","ko":"양측에 이득이 되는 해결안을 찾을 수 있을 것으로 봅니다","en":"We believe we can work out a solution that benefits both sides.","nuance":"work out은 '문제를 풀어 해결책을 만들어내다'. work something out은 '뭔가 방법을 찾다'. It'll work out in the end은 '결국 잘 될 거야'라는 낙관적 마무리예요.","mistake":{"x":"We can solve a solution.","o":"We can work out a solution.","why":"solve는 이미 있는 문제를 푸는 것이라 solution과 함께 쓰지 않습니다. 해결책을 '만들어내다'는 work out이에요."},"variants":[{"en":"Let me discuss it internally and see if we can work something out.","ko":"내부에서 논의하고 방법을 찾아볼게요."},{"en":"I'm sure it'll work out in the end.","ko":"결국 잘 될 거예요."},{"en":"Your worries about costs are reasonable — maybe we can work something out.","ko":"비용 걱정은 충분히 이해됩니다. 방법이 있을 겁니다."},{"en":"We can find a middle ground.","ko":"중간점을 찾을 수 있습니다."}]},{"n":11,"title":"잠깐 줌으로 통화 가능?","situation":"메일로 길게 쓰기보다 바로 통화로 정리하고 싶을 때","ko":"잠깐 줌으로 통화할 수 있어?","en":"Can we jump on a zoom call real quick?","nuance":"jump on a call은 '통화에 바로 들어가다'. real quick은 '아주 잠깐'. 대화를 정리할 땐 Well, that covers what I wanted to talk about.","mistake":{"x":"Can we do zoom call short time?","o":"Can we jump on a zoom call real quick?","why":"short time은 '짧은 시간'이라는 명사구라서 문장에 자연스럽게 붙지 않습니다. real quick이 회화의 기본형이에요."},"variants":[{"en":"Can we hop on a call?","ko":"통화 가능해요?"},{"en":"Do you have five minutes?","ko":"5분 시간 돼요?"},{"en":"Let's take this offline.","ko":"이건 따로 이야기하죠."},{"en":"Well, that covers what I wanted to talk about.","ko":"네, 제가 하고 싶은 얘기는 다 했네요."}]}],"extras":[{"en":"A: The client asked for better payment terms. B: Let me discuss it internally and see if we can work something out.","ko":"고객사가 더 나은 결제 조건을 요청했어요. 내부에서 논의하고 조정 방안을 찾아볼게요."},{"en":"A: I'm still worried about the budget issue. B: Don't worry too much. I'm sure it'll work out in the end.","ko":"예산 문제가 아직 걱정돼요. 너무 걱정 마세요, 결국 잘 될 거예요."},{"en":"If possible, we'd like to keep the schedule as is.","ko":"가능하면 일정은 그대로 유지하고 싶습니다."},{"en":"We hope this meeting strengthens our long-term partnership.","ko":"이번 만남이 장기적 파트너십을 더욱 공고히 하기를 바랍니다."},{"en":"That might be too soon.","ko":"그건 너무 이른 것 같아요."},{"en":"When do you think you can be ready?","ko":"언제쯤 준비될 것 같으세요?"},{"en":"Is there anything else that you want to try while you are here?","ko":"여기 있는 동안 더 해보고 싶은 게 있으세요?"},{"en":"Do you like working in this line of work?","ko":"이 분야에서 일하시는 건 마음에 드세요?"},{"en":"How did you do in your last job?","ko":"전 직장에서는 어떻게 지내셨나요?"},{"en":"How is the business plan going?","ko":"사업 계획서는 어떻게 돼가고 있나요?"},{"en":"We gotta do what we gotta do.","ko":"우리는 해야 할 일을 해야지."},{"en":"How much longer until we finish?","ko":"끝나려면 얼마나 더 걸려요?"},{"en":"How can I reach you? What's the best way to reach you?","ko":"어떻게 연락드리면 될까요? 가장 좋은 연락 방법은 무엇인가요?"},{"en":"I invite you to be here with me while I am here with you so that I can make this easier for you.","ko":"제가 여러분과 함께 있는 동안 더 쉽게 도와드릴 수 있도록 이 자리에 함께해 주세요."}]}]}</script>
<script>
/* 영어뇌 랩 — app logic (vanilla JS, no dependencies)
   Flow per unit: ① 한국어만 보고 말하기 → ② 핵심 문장 + 뉘앙스 해설 → ③ 변형 드릴 → ④ 완료
   Storage key: liveacademy.v1 */
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('app-data').textContent);
  var LS_KEY = 'liveacademy.v1';
  var UNITS = [];        // flat list of {ch, unit, id}
  var CH = {};           // chapter id -> chapter

  DATA.chapters.forEach(function (ch) {
    CH[ch.id] = ch;
    ch.units.forEach(function (u) {
      u.id = ch.id + '-' + u.n;
      u.chapterId = ch.id;
      UNITS.push({ id: u.id, ch: ch, unit: u });
    });
  });
  var TOTAL = UNITS.length;

  var S = {
    progress: {},                       // unitId -> {done, at, score}
    days: {},                           // 'YYYY-MM-DD' -> units completed that day
    streak: { count: 0, last: '' },
    settings: { theme: 'system', rate: 1, autoPlay: true },
    ui: { tab: 'home', chapter: '' }
  };
  var UI = { tab: 'home', open: '' };
  var L = null;   // lesson state
  var R = null;   // review state
  var rate = 1;

  /* ---------------------------------------------------------------- helpers */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function shiftDay(str, delta) {
    var p = str.split('-');
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    dt.setDate(dt.getDate() + delta);
    return todayStr(dt);
  }
  function toast(msg) {
    var t = $('#toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }
  function unitById(id) {
    for (var i = 0; i < UNITS.length; i++) if (UNITS[i].id === id) return UNITS[i];
    return null;
  }
  function nextUnitId(id) {
    for (var i = 0; i < UNITS.length; i++) if (UNITS[i].id === id) return UNITS[i + 1] ? UNITS[i + 1].id : null;
    return null;
  }
  function isDone(id) { return !!(S.progress[id] && S.progress[id].done); }
  function doneCount() {
    var n = 0;
    for (var i = 0; i < UNITS.length; i++) if (isDone(UNITS[i].id)) n++;
    return n;
  }
  function chapterDone(ch) {
    var n = 0;
    ch.units.forEach(function (u) { if (isDone(u.id)) n++; });
    return n;
  }

  /* ------------------------------------------------------------- persistence */
  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      if (o.progress && typeof o.progress === 'object') S.progress = o.progress;
      if (o.days && typeof o.days === 'object') S.days = o.days;
      if (o.streak) S.streak = { count: o.streak.count || 0, last: o.streak.last || '' };
      if (o.settings) S.settings = Object.assign(S.settings, o.settings);
      if (o.ui) S.ui = Object.assign(S.ui, o.ui);
    } catch (e) { /* corrupted storage: start fresh */ }
  }
  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        progress: S.progress, days: S.days, streak: S.streak, settings: S.settings, ui: S.ui
      }));
    } catch (e) { /* storage full or blocked */ }
  }

  /* ------------------------------------------------------------------ theme */
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyTheme() {
    var t = S.settings.theme || 'system';
    var dark = t === 'dark' || (t === 'system' && mq && mq.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#05141d' : '#0A2239');
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);

  /* ----------------------------------------------------------------- streak */
  function currentStreak() {
    var t = todayStr();
    if (S.streak.last === t) return S.streak.count || 0;
    if (S.streak.last === shiftDay(t, -1)) return S.streak.count || 0;
    return 0;
  }
  function bumpStreak() {
    var t = todayStr();
    S.days[t] = (S.days[t] || 0) + 1;
    if (S.streak.last === t) { save(); return; }
    S.streak.count = (S.streak.last === shiftDay(t, -1)) ? (S.streak.count || 0) + 1 : 1;
    S.streak.last = t;
    save();
  }

  /* -------------------------------------------------------- speech synthesis */
  var voices = [];
  function refreshVoices() {
    try { voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; } catch (e) { voices = []; }
  }
  if ('speechSynthesis' in window) {
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }
  function pickVoice() {
    var prefs = ['Google US English', 'Samantha', 'Ava', 'Allison',
      'Microsoft Aria Online (Natural)', 'Microsoft Jenny Online (Natural)', 'Microsoft Zira', 'Karen', 'Daniel', 'Alex'];
    var i, j;

  function startReview() {
    var pool = shuffle(doneUnits());

      }
      items.push({ id: ref.id, ch: ref.ch, unit: ref.unit, options: shuffle(opts) });
    }

  /* --------------------------------------------------------------- backup */
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var isArr = function (v) { return Object.prototype.toString.call(v) === '[object Array]'; };

  function backupPayload() {
    var p = { progress: {}, days: {}, streak: { count: 0, last: '' }, settings: {} };
    Object.keys(S.progress || {}).forEach(function (k) {
      var v = S.progress[k];
      if (!unitById(k) || !v || !v.done) return;
      var e = { done: true };
      if (typeof v.at === 'string' && DATE_RE.test(v.at)) e.at = v.at;
      if (typeof v.score === 'number') e.score = v.score;
      p.progress[k] = e;
    });
    Object.keys(S.days || {}).forEach(function (k) {
      if (DATE_RE.test(k) && typeof S.days[k] === 'number') p.days[k] = S.days[k];
    });
    p.streak = { count: S.streak.count || 0, last: S.streak.last || '' };
    ['theme', 'rate', 'autoPlay', 'reviewMode'].forEach(function (k) {
      if (typeof S.settings[k] !== 'undefined') p.settings[k] = S.settings[k];
    });
    return p;
  }
  function backupJson() {
    return JSON.stringify({
      app: 'English Brain Lab',
      kind: 'liveacademy.backup',
      version: 1,
      exportedAt: new Date().toISOString(),
      payload: backupPayload()
    }, null, 2);
  }
  function parseBackup(raw) {
    var text = String(raw == null ? '' : raw).trim();
    if (!text) throw new Error('백업 내용이 비어 있어요.');
    if (text.length > 2000000) throw new Error('백업 내용이 너무 커요(2MB 초과).');
    var o;
    try { o = JSON.parse(text); } catch (e) { throw new Error('JSON 형식이 아니에요. 백업 파일인지 확인해 주세요.'); }
    if (!o || typeof o !== 'object' || isArr(o)) throw new Error('백업 형식이 아니에요.');
    var p = (o.payload && typeof o.payload === 'object' && !isArr(o.payload)) ? o.payload : o;
    var out = { progress: {}, days: {}, streak: { count: 0, last: '' }, settings: {} };
    if (p.progress && typeof p.progress === 'object' && !isArr(p.progress)) {
      Object.keys(p.progress).forEach(function (k) {
        var v = p.progress[k];
        if (!unitById(k) || !v || typeof v !== 'object' || !v.done) return;
        var e = { done: true };
        if (typeof v.at === 'string' && DATE_RE.test(v.at)) e.at = v.at;
        var sc = Number(v.score);
        e.score = isFinite(sc) ? Math.max(0, Math.min(100, Math.round(sc))) : 0;
        out.progress[k] = e;
      });
    }
    if (p.days && typeof p.days === 'object' && !isArr(p.days)) {
      Object.keys(p.days).forEach(function (k) {
        var n = Number(p.days[k]);
        if (DATE_RE.test(k) && isFinite(n) && n >= 0) out.days[k] = Math.min(1000, Math.floor(n));
      });
    }
    if (p.streak && typeof p.streak === 'object') {
      var c = Number(p.streak.count);
      out.streak.count = isFinite(c) && c > 0 ? Math.min(10000, Math.floor(c)) : 0;
      out.streak.last = (typeof p.streak.last === 'string' && DATE_RE.test(p.streak.last)) ? p.streak.last : '';
    }
    var se = p.settings;
    if (se && typeof se === 'object') {
      if (se.theme === 'light' || se.theme === 'dark' || se.theme === 'system') out.settings.theme = se.theme;
      if (se.rate === 0.7 || se.rate === 0.8 || se.rate === 1) out.settings.rate = se.rate;
      if (typeof se.autoPlay === 'boolean') out.settings.autoPlay = se.autoPlay;
      if (se.reviewMode === 'choice' || se.reviewMode === 'say') out.settings.reviewMode = se.reviewMode;
    }
    if (!Object.keys(out.progress).length && !Object.keys(out.days).length) {
      throw new Error('복원할 학습 기록을 찾지 못했어요.');
    }
    return out;
  }
  function applyBackup(raw) {
    var msgBox = $('#restore-msg');
    if (msgBox) msgBox.textContent = '';
    var data, msg;
    try { data = parseBackup(raw); } catch (e) {
      msg = (e && e.message) ? e.message : '백업을 읽지 못했어요.';
      toast(msg);
      if (msgBox) msgBox.textContent = msg;
      return;
    }
    var nowCount = Object.keys(S.progress || {}).length;
    var nextCount = Object.keys(data.progress || {}).length;
    if (!window.confirm('백업 내용으로 복원할까요?\n\n지금 기록: ' + nowCount + '개 유닛\n백업 내용: ' + nextCount + '개 유닛 · 연속 ' + data.streak.count + '일\n\n지금 기록은 백업 내용으로 바뀝니다.')) return;
    S.progress = data.progress;
    S.days = data.days;
    S.streak = data.streak;
    Object.keys(data.settings || {}).forEach(function (k) { S.settings[k] = data.settings[k]; });
    rate = S.settings.rate || 1;
    save();
    applyTheme();
    closeSettings();
    render();
    toast(nextCount + '개 유닛 기록을 복원했어요.');
  }
  function showBackupText(text) {
    var t = $('#backup-json');
    if (t) {
      t.value = text;
      t.hidden = false;
      if (t.focus) t.focus();
      if (t.select) { try { t.select(); } catch (e) { } }
    }
    toast('클립보드가 막혀 있어요. 아래 칸의 내용을 직접 복사해 주세요.');
  }
  function downloadBackup() {
    var text = backupJson();
    var name = 'live-academy-backup-' + todayStr() + '.json';
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(url);
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 1500);
      toast('백업 파일을 저장했어요: ' + name);
    } catch (e) { showBackupText(text); }
  }
  function copyBackup() {
    var text = backupJson();
    if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('백업 JSON을 복사했어요. 메모에 붙여넣어 보관하세요.');
      }).catch(function () { showBackupText(text); });
      return;
    }
    showBackupText(text);
  }
  function restoreFromFile(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { toast('파일이 너무 커요(5MB 초과).'); return; }
    if (typeof FileReader === 'undefined') { toast('이 브라우저에서는 파일을 읽을 수 없어요.'); return; }
    var reader = new FileReader();
    reader.onload = function () { applyBackup(reader.result); };
    reader.onerror = function () { toast('파일을 읽지 못했어요.'); };
    reader.readAsText(file);
  }
