<title>영어뇌 랩 · 라이브 아카데미 스타일 영어 트레이닝</title>
<style>
/* 영어뇌 랩 — deep navy / emerald theme (vanilla CSS, no dependencies) */
:root {
  --navy-900: #071a2b;
  --navy-800: #0a2239;
  --navy-700: #10314a;
  --emerald-600: #047857;
  --emerald-500: #10b981;
  --emerald-400: #34d399;
  --emerald-100: #d9f5ea;
  --bg: #eef4f3;
  --bg-2: #f8fbfb;
  --surface: #ffffff;
  --surface-2: #f3f8f7;
  --text: #0d2735;
  --text-2: #5b7683;
  --text-3: #8ba1ab;
  --line: #dbe7e6;
  --line-2: #eaf1f0;
  --brand: #047857;
  --brand-soft: #e2f6ee;
  --on-brand: #ffffff;
  --ok: #059669;
  --warn: #b45309;
  --bad: #dc2626;
  --bad-soft: #fdecec;
  --ok-soft: #e6f7f0;
  --shadow: 0 10px 30px rgba(9, 43, 60, 0.08);
  --shadow-lg: 0 24px 60px rgba(6, 32, 46, 0.22);
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
  --tabbar-h: 62px;
}

html[data-theme="dark"] {
  --bg: #05141d;
  --bg-2: #071b26;
  --surface: #0b2230;
  --surface-2: #0f2b3a;
  --text: #e6f2f0;
  --text-2: #9db6c0;
  --text-3: #78909b;
  --line: #17323f;
  --line-2: #122936;
  --brand: #34d399;
  --brand-soft: #0e3a30;
  --on-brand: #04150f;
  --emerald-100: #0d3b31;
  --bad-soft: #3a1a1c;
  --ok-soft: #0d3a2d;
  --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  font-family: "Liberation Sans", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
    "Malgun Gothic", "Segoe UI", Roboto, "Helvetica Neue", Arial, "FreeSans", sans-serif;
  background:
    radial-gradient(900px 420px at 78% -8%, rgba(16, 185, 129, 0.16), transparent 62%),
    radial-gradient(700px 380px at -10% 8%, rgba(13, 61, 90, 0.14), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 52%, var(--bg) 100%);
  color: var(--text);
  min-height: 100dvh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

/* ------------------------------------------------------------ top bar */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 12px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  background: linear-gradient(152deg, #0a2239 6%, #0f4b43 58%, #10b981 100%);
  color: #eafff6; display: grid; place-items: center;
  font-weight: 800; font-size: 15px; letter-spacing: -0.03em;
  box-shadow: 0 6px 16px rgba(7, 45, 39, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.22);
}
.brand-name { font-size: 15.5px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
.brand-sub { font-size: 10.5px; color: var(--text-3); letter-spacing: .04em; font-weight: 600; }
.streak {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 11px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 12.5px; font-weight: 800; color: var(--text);
  box-shadow: var(--shadow);
}
.streak .flame { font-size: 13px; }
.streak small { font-weight: 600; color: var(--text-2); font-size: 10.5px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  display: grid; place-items: center; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
  transition: transform .15s ease, color .15s ease;
}
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { stroke: currentColor; }

/* ------------------------------------------------------------ content */
.content { flex: 1; padding: 6px 18px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 26px); }
.h1 { font-size: 23px; font-weight: 800; letter-spacing: -0.035em; margin: 10px 0 2px; line-height: 1.32; }
.h1 em { font-style: normal; color: var(--brand); }
.sub { margin: 0 0 16px; color: var(--text-2); font-size: 12.5px; }
.section-title {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-3); margin: 24px 2px 10px;
}
.section-title span { font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--text-3); }

/* hero */
.hero {
  position: relative; overflow: hidden;
  border-radius: var(--r-lg); padding: 20px;
  background:
    radial-gradient(420px 200px at 88% -20%, rgba(52, 211, 153, .45), transparent 62%),
    radial-gradient(300px 180px at 0% 120%, rgba(16, 185, 129, .22), transparent 70%),
    linear-gradient(150deg, #071a2b 0%, #0a2239 42%, #0b3a3a 100%);
  color: #f2fbf8; box-shadow: var(--shadow-lg); margin-top: 6px;
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 82% 18%, rgba(255, 255, 255, .12), transparent 46%);
  pointer-events: none;
}
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; z-index: 1; }
.hero-kicker { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #8fe3c8; font-weight: 800; }
.hero-title { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; margin: 6px 0 4px; line-height: 1.35; }
.hero-note { font-size: 12px; color: rgba(232, 250, 244, .78); margin: 0; }
.ring { position: relative; width: 66px; height: 66px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring-track { stroke: rgba(255, 255, 255, .18); }
.ring-fill { stroke: #4ade9f; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ring-num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 800; letter-spacing: -0.03em; }
.hero-bar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .17); margin: 16px 0 8px; overflow: hidden; position: relative; z-index: 1; }
.hero-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #34d399, #a7f3d0); transition: width .5s ease; }
.hero-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: rgba(224, 246, 240, .72); position: relative; z-index: 1; }
.hero-cta {
  position: relative; z-index: 1; margin-top: 16px; width: 100%;
  border: 0; cursor: pointer; border-radius: 14px; padding: 14px 16px;
  background: linear-gradient(180deg, #37e0a5, #10b981);
  color: #04241a; font-weight: 800; font-size: 14.5px; letter-spacing: -0.01em;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 12px 24px rgba(16, 185, 129, .3), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .15s ease;
}
.hero-cta:active { transform: scale(.985); }
.hero-cta small { font-weight: 700; opacity: .72; font-size: 12px; }

/* chapter list */
.chapter {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 15px 15px 13px; margin-bottom: 12px; box-shadow: var(--shadow);
  transition: border-color .18s ease, transform .18s ease;
}
.chapter.open { border-color: color-mix(in srgb, var(--brand) 42%, var(--line)); }
.chapter-head { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.chapter-no {
  width: 40px; height: 40px; border-radius: 13px; flex: none; display: grid; place-items: center;
  font-weight: 800; font-size: 13px; letter-spacing: -0.02em;
  background: var(--brand-soft); color: var(--brand);
}
.chapter.open .chapter-no { background: linear-gradient(150deg, #0a2239, #0f766e); color: #e9fff7; }
.chapter-main { flex: 1; min-width: 0; }
.chapter-name { font-size: 14.5px; font-weight: 800; letter-spacing: -0.02em; margin: 1px 0 1px; }
.chapter-sub { font-size: 11.5px; color: var(--text-2); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.chapter-count { font-size: 11px; font-weight: 800; color: var(--brand); }
.chev { width: 16px; height: 16px; color: var(--text-3); transition: transform .2s ease; }
.chapter.open .chev { transform: rotate(180deg); }
.chapter-bar { height: 4px; border-radius: 99px; background: var(--line-2); margin: 11px 0 0; overflow: hidden; }
.chapter-bar i { display: block; height: 100%; background: linear-gradient(90deg, #10b981, #6ee7b7); border-radius: 99px; }
.chapter-body { display: none; margin-top: 12px; }
.chapter.open .chapter-body { display: block; }
.chapter-tagline { font-size: 12px; color: var(--text-2); margin: 0 0 10px; line-height: 1.6; }

.unit {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 11px 10px; border-radius: var(--r-sm); border: 1px solid transparent;
  background: none; text-align: left; cursor: pointer; color: inherit; font: inherit;
  transition: background .15s ease;
}
.unit + .unit { border-top: 1px solid var(--line-2); border-radius: 0; }
.unit:active { background: var(--surface-2); }
.unit-n {
  width: 24px; height: 24px; border-radius: 8px; flex: none; display: grid; place-items: center;
  font-size: 11px; font-weight: 800; color: var(--text-3); background: var(--surface-2);
}
.unit.done .unit-n { background: var(--brand); color: var(--on-brand); }
.unit-txt { flex: 1; min-width: 0; }
.unit-txt { display: block; }
.unit-title { display: block; font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.38; }
.unit-ko { display: block; font-size: 11px; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit-go { font-size: 11px; font-weight: 800; color: var(--brand); flex: none; }
.unit.done .unit-go { color: var(--text-3); font-weight: 700; }

/* extras */
.extras { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
.extras summary {
  cursor: pointer; font-size: 12px; font-weight: 800; color: var(--text-2); list-style: none;
  display: flex; align-items: center; gap: 6px;
}
.extras summary::-webkit-details-marker { display: none; }
.extras summary::before { content: "＋"; color: var(--brand); font-weight: 900; }
.extras[open] summary::before { content: "－"; }
.ex { display: flex; gap: 8px; padding: 8px 0 0; font-size: 12.5px; line-height: 1.5; }
.ex b { color: var(--text); font-weight: 600; }
.ex span { color: var(--text-2); flex: none; }

/* ------------------------------------------------------------ tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; justify-content: center; gap: 2px;
  padding: 6px 12px calc(env(safe-area-inset-bottom, 0px) + 6px);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(18px) saturate(1.3);
  border-top: 1px solid var(--line);
}
.tabbar button {
  flex: 1; max-width: 150px; border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 4px; border-radius: 12px;
  font-size: 10.5px; font-weight: 700; color: var(--text-3); font-family: inherit;
  transition: color .15s ease, background .15s ease;
}
.tabbar button .ico svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--brand); background: color-mix(in srgb, var(--brand) 9%, transparent); }

/* ------------------------------------------------------------ lesson sheet */
.lesson {
  position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
  background: var(--bg-2); animation: sheet .26s cubic-bezier(.2, .8, .3, 1);
}
.lesson[hidden] { display: none; }
@keyframes sheet { from { transform: translateY(22px); opacity: .4; } to { transform: none; opacity: 1; } }
.lesson-head {
  display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px;
  border-bottom: 1px solid var(--line); background: var(--bg-2);
}
.lesson-head .icon-btn { width: 34px; height: 34px; border-radius: 10px; }
.lesson-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 800; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson-title small { display: block; font-size: 10.5px; color: var(--text-3); font-weight: 600; }
.steps { display: flex; gap: 4px; padding: 0 16px 10px; background: var(--bg-2); }
.steps i { flex: 1; height: 4px; border-radius: 99px; background: var(--line); transition: background .25s ease; }
.steps i.on { background: var(--brand); }
.steps i.past { background: color-mix(in srgb, var(--brand) 42%, var(--line)); }
.lesson-body { flex: 1; overflow-y: auto; padding: 18px 18px 120px; -webkit-overflow-scrolling: touch; }
.lesson-foot {
  position: sticky; bottom: 0; margin: 0; padding: 12px 18px calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: linear-gradient(180deg, transparent, var(--bg-2) 34%);
  display: flex; gap: 8px; align-items: center;
}
.lesson-foot .btn { flex: 1; }
.step-label { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--brand); margin-bottom: 8px; }

/* step 1 */
.sit {
  background: linear-gradient(150deg, var(--brand-soft), transparent 130%);
  border: 1px solid color-mix(in srgb, var(--brand) 22%, var(--line));
  border-radius: var(--r-md); padding: 13px 14px; margin-bottom: 16px;
}
.sit b { display: block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); margin-bottom: 5px; }
.sit p { margin: 0; font-size: 13px; color: var(--text); line-height: 1.62; }
.kobig { font-size: 24px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.42; margin: 0 0 8px; word-break: keep-all; }
.konote { font-size: 12px; color: var(--text-2); margin: 0 0 18px; }
.mask-hint {
  display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-3);
  border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 10px 12px; margin-bottom: 16px;
}
.mask-hint b { color: var(--text-2); font-weight: 700; flex: none; white-space: nowrap; }
.mask-hint span { flex: 1; min-width: 0; }

.mic-row { display: flex; gap: 8px; }
.mic-row .btn { white-space: nowrap; }
.mic-row .btn.mic { min-width: 0; padding-left: 10px; padding-right: 10px; font-size: 13.5px; }
.mic-row .btn.side { flex: 0 0 104px; padding-left: 8px; padding-right: 8px; font-size: 13px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 14px; padding: 13px 16px; font: inherit; font-weight: 800; font-size: 14px;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .14s ease, background .15s ease, border-color .15s ease;
}
.btn:active { transform: scale(.985); }
.btn svg { width: 18px; height: 18px; }
.btn.primary {
  background: linear-gradient(180deg, #12c68c, #059669); color: #fff; border-color: transparent;
  box-shadow: 0 8px 20px rgba(5, 150, 105, .26);
}
.btn.primary:disabled { opacity: .45; box-shadow: none; }
.btn.ghost { background: transparent; }
.btn.mic { flex: 1; }
.btn.mic.listening { background: var(--bad-soft); border-color: #fecaca; color: #b91c1c; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, .08); } }
.btn.block { width: 100%; }

.typebox { margin-top: 10px; }
.typebox input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 12px; padding: 12px 13px; font: inherit; font-size: 14px; outline: none;
}
.typebox input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent); }

.result { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 13px; }
.result .said { font-size: 11.5px; color: var(--text-2); margin-bottom: 8px; }
.result .said b { color: var(--text); font-weight: 700; }
.marks { font-size: 14px; line-height: 1.7; }
.marks .w { padding: 0 1px; border-radius: 4px; }
.marks .w.ok { color: var(--ok); }
.marks .w.miss { color: #b91c1c; background: var(--bad-soft); text-decoration: underline; text-decoration-style: dotted; }
.mbar { height: 6px; border-radius: 99px; background: var(--line-2); margin: 10px 0 6px; overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 99px; }
.mscore { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--text-2); }
.mscore .num { font-size: 17px; font-weight: 800; }
.fb { margin-top: 9px; font-size: 12px; padding: 9px 11px; border-radius: 10px; background: var(--surface-2); color: var(--text-2); }
.fb.good { background: var(--ok-soft); color: #065f46; }
.fb.mid { background: #fff7e6; color: #92400e; }
.fb.low { background: var(--bad-soft); color: #991b1b; }
html[data-theme="dark"] .fb.good { color: #7ef0c6; }
html[data-theme="dark"] .fb.mid { background: #3b2a12; color: #fbd38d; }
html[data-theme="dark"] .fb.low { color: #fca5a5; }

/* step 2 */
.encard {
  position: relative; border-radius: var(--r-lg); padding: 18px 18px 16px;
  background: linear-gradient(155deg, #0a2239, #0a3340 62%, #0d4a3f);
  color: #f0fbf7; box-shadow: var(--shadow-lg); margin-bottom: 14px;
}
.encard .en { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.5; margin: 0 0 12px; word-break: keep-all; }
.encard .en small { display: block; font-size: 12.5px; font-weight: 500; color: rgba(226, 247, 240, .72); margin-top: 7px; letter-spacing: 0; }
.speed { display: flex; gap: 6px; flex-wrap: wrap; }
.speed button {
  border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .08); color: #eafff7;
  border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 11.5px; font-weight: 800; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
.speed button[aria-pressed="true"] { background: #4ade9f; color: #04241a; border-color: transparent; }
.speed button svg { width: 14px; height: 14px; }

.panel { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px; margin-bottom: 12px; }
.srcline {
  display: flex; align-items: flex-start; gap: 6px; flex-wrap: wrap;
  margin: -4px 2px 12px; font-size: 11px; line-height: 1.5; color: var(--text-3);
}
.srcline svg { width: 12px; height: 12px; flex: none; margin-top: 1px; }
.srcline a { color: var(--brand-ink, var(--brand)); text-decoration: underline; text-underline-offset: 2px; }
.srcline a:hover { opacity: .8; }
.panel h3 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .04em; color: var(--text-3); font-weight: 800; }
.panel p { margin: 0; font-size: 13px; line-height: 1.68; color: var(--text); word-break: keep-all; }
.panel.nuance { border-left: 3px solid var(--brand); }
.panel.nuance p { color: var(--text); }
.mistake { display: grid; gap: 8px; }
.mx { display: flex; gap: 9px; font-size: 12.5px; line-height: 1.55; }
.mx .tag { flex: none; width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 900; margin-top: 1px; }
.mx.bad .tag { background: var(--bad-soft); color: #b91c1c; }
.mx.good .tag { background: var(--ok-soft); color: var(--ok); }
.mx.bad .txt { color: var(--text-3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, #dc2626 55%, transparent); }
.mx.good .txt { color: var(--text); font-weight: 700; }
.why { margin: 10px 0 0; padding-top: 9px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--text-2); line-height: 1.62; }

/* step 3 */
.drill-intro { font-size: 12.5px; color: var(--text-2); margin: 0 0 12px; }
.vcard { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 13px; margin-bottom: 10px; }
.vcard-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 9px; }
.vnum { flex: none; width: 20px; height: 20px; border-radius: 7px; background: var(--brand-soft); color: var(--brand); font-size: 10.5px; font-weight: 900; display: grid; place-items: center; }
.ven { flex: 1; font-size: 14.5px; font-weight: 700; line-height: 1.5; letter-spacing: -0.01em; word-break: keep-all; }
.vko { font-size: 11.5px; color: var(--text-2); margin-left: 28px; }
.vacts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.mini {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2);
  border-radius: 9px; padding: 6px 10px; font: inherit; font-size: 11px; font-weight: 800; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
.mini svg { width: 13px; height: 13px; }
.mini.listening { background: var(--bad-soft); color: #b91c1c; border-color: #fecaca; }
.mini.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

/* step 4 */
.done-wrap { text-align: center; padding: 14px 4px; }
.done-badge {
  width: 76px; height: 76px; margin: 6px auto 14px; border-radius: 50%;
  background: linear-gradient(155deg, #0a2239, #0f766e 60%, #34d399);
  display: grid; place-items: center; color: #eafff7; box-shadow: 0 16px 34px rgba(16, 185, 129, .3);
}
.done-badge svg { width: 34px; height: 34px; }
.done-wrap h2 { font-size: 20px; letter-spacing: -0.03em; margin: 0 0 6px; }
.done-wrap p { font-size: 13px; color: var(--text-2); margin: 0 0 18px; }
.recap { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px; margin-bottom: 14px; }
.recap .rrow { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }
.recap .rrow:last-child { border-bottom: 0; }
.recap .rrow b { color: var(--brand); flex: none; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding-top: 3px; width: 42px; }
.recap .rrow span { color: var(--text); line-height: 1.5; }

/* ------------------------------------------------------------ review */
.review-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }
.review-card h2 { margin: 0 0 6px; font-size: 17px; letter-spacing: -0.02em; }
.review-card p { margin: 0 0 14px; font-size: 12.5px; color: var(--text-2); }
.seg { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin-bottom: 14px; }
.seg button {
  flex: 1; border: 0; background: none; border-radius: 9px; padding: 9px 6px; cursor: pointer;
  font: inherit; font-size: 12px; font-weight: 800; color: var(--text-2);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand); box-shadow: 0 2px 8px rgba(9, 43, 60, .08); }
.quiz-q { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.4; margin: 0 0 4px; word-break: keep-all; }
.quiz-sit { font-size: 12px; color: var(--text-2); margin: 0 0 14px; }
.qmeta { display: flex; justify-content: space-between; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; color: var(--text-3); margin-bottom: 10px; }
.opt {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 13px; padding: 12px 13px; margin-bottom: 8px; font: inherit; font-size: 13.5px;
  color: var(--text); cursor: pointer; line-height: 1.45; transition: border-color .15s ease, background .15s ease;
}
.opt:active { background: var(--surface-2); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); font-weight: 700; }
.opt.wrong { border-color: #f3b4b4; background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.qresult { margin-top: 6px; font-size: 12.5px; color: var(--text-2); }
.score-big { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--brand); }

/* ------------------------------------------------------------ stats */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 13px 10px; text-align: center; }
.stat b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
.stat span { font-size: 10.5px; color: var(--text-2); font-weight: 600; }
.streakbox {
  display: flex; align-items: center; gap: 14px; margin-top: 12px; padding: 15px;
  border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface);
}
.streakbox .big { font-size: 30px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.streakbox .lbl { font-size: 11.5px; color: var(--text-2); }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 74px; margin-top: 10px; padding: 10px 4px 0; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.bars i { display: block; width: 100%; border-radius: 5px 5px 3px 3px; background: color-mix(in srgb, var(--brand) 28%, var(--line-2)); min-height: 3px; }
.bars i.on { background: linear-gradient(180deg, #34d399, #059669); }
.bars span { font-size: 8.5px; color: var(--text-3); font-weight: 700; }
.chprog { margin-top: 10px; }
.chprog .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }
.chprog .row:last-child { border-bottom: 0; }
.chprog .nm { flex: 1; font-weight: 700; }
.chprog .ct { font-size: 11px; color: var(--text-2); font-weight: 700; }
.chprog .track { width: 74px; height: 5px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.chprog .track i { display: block; height: 100%; background: linear-gradient(90deg, #10b981, #6ee7b7); }

/* ------------------------------------------------------------ modal */
.modal { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; }
.modal[hidden] { display: none; }
.modal-bg { position: absolute; inset: 0; background: rgba(4, 18, 28, .48); backdrop-filter: blur(3px); }
.sheet {
  position: relative; width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto;
  background: var(--bg-2); border-radius: 24px 24px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
  box-shadow: var(--shadow-lg); animation: up .25s cubic-bezier(.2, .8, .3, 1);
}
@keyframes up { from { transform: translateY(40px); } to { transform: none; } }
.sheet-grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 4px auto 14px; }
.sheet h2 { font-size: 17px; letter-spacing: -0.02em; margin: 0 0 14px; }
.field { margin-bottom: 16px; }
.field > label { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 800; margin-bottom: 7px; }
.field .hint { font-size: 11.5px; color: var(--text-2); margin: 6px 0 0; line-height: 1.55; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line-2); }
.switch:last-child { border-bottom: 0; }
.switch span { font-size: 13.5px; font-weight: 700; }
.switch small { display: block; font-size: 11px; color: var(--text-2); font-weight: 500; }
.tgl { width: 46px; height: 27px; border-radius: 99px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .18s ease; }
.tgl::after { content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .18s ease; }
.tgl[aria-checked="true"] { background: var(--brand); }
.tgl[aria-checked="true"]::after { transform: translateX(19px); }
textarea {
  width: 100%; min-height: 92px; border: 1px solid var(--line); border-radius: 12px; padding: 11px;
  font: inherit; font-size: 11.5px; background: var(--surface); color: var(--text); resize: vertical; line-height: 1.5;
}
.danger { color: #b91c1c; border-color: #f3c7c7; }
.small { font-size: 11px; color: var(--text-3); line-height: 1.6; margin: 8px 0 0; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 26px); transform: translate(-50%, 12px);
  z-index: 90; max-width: 86vw; padding: 11px 16px; border-radius: 12px;
  background: #0a2239; color: #eafff7; font-size: 12.5px; font-weight: 600; line-height: 1.45;
  box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 640px) {
  .lesson { max-width: 560px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .tabbar { max-width: 560px; margin: 0 auto; border-radius: 0; }
  .kobig { font-size: 27px; }
}

</style>

도 그대로 됩니다.","mistake":{"x":"What did he do so people got mad?","o":"What did he do that got people so mad?","why":"so people got mad는 '그래서 사람들이 화났다'는 원인·결과 접속이 됩니다. '~했길래'의 그 행동을 받아 주는 것은 관계대명사 that입니다."},"variants":[{"en":"What did he do that got people so angry?","ko":"걔가 뭘 했길래 사람들이 그렇게 화가 난 거야?"},{"en":"What did she do that got people so mad?","ko":"걔가 뭘 했길래 사람들이 그렇게 화가 난 거야?"}],"source":"영어 뇌 만들기 문장 8개 : Part 1 · 라이브 아카데미","sourceUrl":"https://youtu.be/4FDGkA7aVoU"},{"n":6,"title":"우리 화장실 벽에 여름마다 곰팡이 피잖아","situation":"배우자에게 늘 있던 집안 문제를 다시 꺼내며, 해결책을 조심스럽게 제안할 때","ko":"우리 화장실 벽에 여름마다 곰팡이 피잖아. 우리 그냥 업자 불러서 거기 창문 하나 내는 거 어떨까?","en":"You know how our bathroom walls collect mold every summer. What if we hired a contractor and just put a window in there?","nuance":"선생님은 이 문장이 두 문장인 이유가 맥락 때문이라고 했습니다. 앞은 '너도 아는 그거 있잖아'라고 공통 배경을 깔아 두는 You know how, 뒤는 '이렇게 하면 어떨까'라는 What if입니다. 끝에 right?를 붙이거나 Well, I was thinking, what if ~로 한 박자 늦춰 제안하면 훨씬 부드러워집니다.","mistake":{"x":"Our bathroom wall has mold every summer. How about we call a repairman and make a window?","o":"You know how our bathroom walls collect mold every summer. What if we hired a contractor and just put a window in there?","why":"이미 둘 다 아는 일을 새 정보처럼 말하면 대화가 어색해집니다. 공통 배경은 You know how로 깔고, '창문을 내다'는 put a window in, 사람은 contractor로 옮깁니다."},"variants":[{"en":"Hey, you know how our bathroom walls collect mold every summer, right?","ko":"야, 우리 화장실 벽에 여름마다 곰팡이 피는 거 알지?"},{"en":"Well, I was thinking, what if we hired a contractor and just put a window in there?","ko":"그러니까, 우리 그냥 업자 불러서 거기 창문 하나 내면 어떨까 싶어서."}],"source":"영어 뇌 만들기 문장 8개 : Part 1 · 라이브 아카데미","sourceUrl":"https://youtu.be/4FDGkA7aVoU"},{"n":7,"title":"연락할게","situation":"헤어지기 전, 전화인지 메일인지 정하지 않고 '나중에 연락하겠다'고 말할 때","ko":"연락할게","en":"I'll be in touch.","nuance":"선생님은 I'll call you, I'll text you, I'll email you처럼 방법을 정하면 그 동사를 쓰지만, 방법을 정하지 않은 '연락할게'는 I'll be in touch라고 했습니다. 더 캐주얼하게는 I'll hit you up. 반대로 '어떻게 연락드리면 될까요?'라고 물을 때는 reach를 써서 How can I reach you aying it's me?","ko":"그게 나라는 거야?"},{"en":"Are you questioning my method?","ko":"지금 내 방식에 의문을 품는 거야?"},{"en":"Are you questioning my logic?","ko":"지금 내 논리를 의심하는 거야?"}],"source":"영어 뇌 만들기 문장 8개 : Part 2 · 라이브 아카데미","sourceUrl":"https://youtu.be/pD7pKoS332s"},{"n":5,"title":"방심하지 말자","situation":"일이 잘 풀리는 순간일수록 긴장을 늦추지 말자고 다잡을 때","ko":"방심하지 말자","en":"Let's not get careless.","nuance":"선생님은 가장 기본형으로 Let's not get careless를 꼽고, get careless가 '방심한 상태가 되다'라고 설명했습니다. 이미 방심한 경우에는 They got careless, We got careless처럼 과거형으로 씁니다. 관용적으로는 Let's not put our guards down, Let's keep our eyes open도 같은 자리에 놓입니다.","mistake":{"x":"Let's not be careless mind.","o":"Let's not get careless.","why":"'방심하다'는 형용사 careless와 get을 붙여 get careless로 씁니다. mind를 덧붙이지 않습니다."},"variants":[{"en":"They got careless.","ko":"걔네가 방심했어."},{"en":"We got careless.","ko":"우리가 좀 방심했네."},{"en":"Let's not put our guards down.","ko":"경계를 늦추지 말자."}],"source":"영어 뇌 만들기 문장 8개 : Part 2 · 라이브 아카데미","sourceUrl":"https://youtu.be/pD7pKoS332s"},{"n":6,"title":"걔 학교 때 의외로 공부 잘했어","situation":"평소 이미지와 달리 성적이 좋았다는 사실을 이야기할 때","ko":"걔 학교 때 의외로 공부 잘했어","en":"He did surprisingly well in school.","nuance":"선생님은 '공부를 잘하다'를 study well로 옮기면 exercise well처럼 어색하게 들린다고 했습니다. 학교 성적을 말할 때는 do well in school이 가장 무난하고, 성적 자체를 말하려면 got good grades, has good grades를 씁니다. '의외로'는 surprisingly로 붙입니다.","mistake":{"x":"He studied well in school surprisingly.","o":"He did surprisingly well in school.","why":"studied well은 '공부를 많이 했다'는 학습량입니다. 성적이 좋았다는 뜻은 did well in school로 말합니다."},"variants":[{"en":"She did surprisingly well in school.","ko":"걔 학교 때 의외로 공부 잘했어."},{"en":"He got good grades.","ko":"걔 성적이 좋았어."},{"en":"He has good grades.","ko":"걔 성적이 좋아."}],"source":"PART 6 : 영어 뇌 만들기 문장 10개 · 라이브 아카데미","sourceUrl":"https://youtu.be/j5QXDsW-Yf0"},{"n":7,"title":"나 거기 며칠 안 있었어","situation":"머문 기간이 짧았다고 말할 때, 부정형인데 영어는 긍정으로 시작하는 문장","ko":"나 거기 며칠 안 있었어","en":"I was there for only a few days.","nuance":"선생님은 '며칠 안'에 숨어 있는 '밖에'를 only로 꺼내면 문장이 풀린다고 했습니 ly talked about.","ko":"잠깐만요, 처음에 얘기한 것보다 크잖아요."},{"en":"This is more than we initially discussed.","ko":"이건 처음에 논의한 것보다 많아요."},{"en":"Wait, this is more than we originally agreed on.","ko":"잠깐만요, 원래 합의한 것보다 많잖아요."}],"source":"PART 6 : 영어 뇌 만들기 문장 10개 · 라이브 아카데미","sourceUrl":"https://youtu.be/j5QXDsW-Yf0"},{"n":10,"title":"전 이거에 익숙해요","situation":"새로운 환경이나 낯선 것에 이미 적응했다고 말할 때, 그리고 아직 적응 중일 때","ko":"전 이거에 익숙해요","en":"I'm used to this.","nuance":"be used to는 '익숙하다'는 상태, get used to는 '익숙해지다'는 변화입니다. 뒤에는 명사나 동명사가 옵니다. 사람을 말할 때는 I'm used to people like him, 음식이면 I'm not used to spicy food처럼 대상을 그대로 붙입니다. 적응하는 중이라면 I'm getting used to my new job입니다.","mistake":{"x":"I'm used to work under pressure.","o":"I'm used to working under pressure.","why":"be used to의 to는 전치사라서 뒤에 동사원형이 오지 않습니다. 동명사 working이 와야 합니다."},"variants":[{"en":"I'm not very used to this.","ko":"전 이거에 아주 익숙하지는 않아요."},{"en":"I'm used to people like him.","ko":"저는 그런 사람들한테 익숙해요."},{"en":"I'm not used to spicy food.","ko":"저는 매운 음식이 익숙하지 않아요."},{"en":"I'm getting used to my new job.","ko":"새 직장에 적응하는 중이에요."}],"source":"Google Drive '영어 스터디' — be used to / get used to 정리","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":11,"title":"예전에는 안 그랬는데","situation":"지금과 달랐던 과거를 떠올리며, 습관이 바뀌었다고 말할 때","ko":"예전에는 안 그랬는데","en":"I never used to be like this.","nuance":"used to는 지금은 하지 않는 과거의 습관이나 상태입니다. be used to(익숙하다)와 모양이 비슷하지만 to 뒤에 동사원형이 온다는 점이 다릅니다. 예전 습관을 말할 때는 I used to play soccer every weekend, but now I don't have time처럼 지금과 대비해 주면 뜻이 또렷해집니다.","mistake":{"x":"I didn't use to be like this before.","o":"I never used to be like this.","why":"문법적으로 틀리지는 않지만 '예전에는 안 그랬다'는 뉘앙스는 never used to가 가장 자연스럽습니다. before를 덧붙이면 군더더기가 됩니다."},"variants":[{"en":"I used to play soccer every weekend, but now I don't have time.","ko":"예전에는 주말마다 축구를 했는데, 지금은 시간이 없어."},{"en":"She used to live in New York, but now she lives in LA.","ko":"그녀는 예전에 뉴욕에 살았지만 지금은 LA에 살아."}],"source":"Goog tion":"일하면서 얻는 좋은 점을 말할 때, '할 수 있어서 좋다'는 기회의 뉘앙스로","ko":"영어를 가르치는 일을 하면서 가장 흥미로운 점 중 하나는 다양한 사람들을 많이 만날 수 있다는 거예요","en":"I think one of the most interesting things about teaching English is that I get to meet a lot of different people.","nuance":"get to는 '~할 수 있어서 좋았다', 즉 허락되거나 기회가 주어진 일을 말할 때 씁니다. 그래서 '만날 수 있다'를 can meet으로 옮기면 사무적인 능력이 되고, get to meet은 그 기회에 대한 만족이 실립니다. 과거에는 got to로 바꿔 씁니다.","mistake":{"x":"I can meet a lot of different people.","o":"I get to meet a lot of different people.","why":"can은 능력이나 가능성입니다. 기회가 주어져서 하게 된다는 뉘앙스는 get to가 담당합니다."},"variants":[{"en":"When I was in Iceland a few years ago, I got to visit a lot of beautiful locations.","ko":"몇 년 전 아이슬란드에 갔을 때 아름다운 장소를 많이 가볼 수 있었어요."},{"en":"As a freelancer, I get to set my own work schedule.","ko":"프리랜서로서 내 근무 일정을 내가 짤 수 있어요."},{"en":"I didn't get to go home right after school.","ko":"학교 끝나고 바로 집에 가지 못했어요."}],"source":"Google Drive '영어 스터디' — get to 예문 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":2,"title":"중국에서 공부할 때 신기한 음식을 많이 먹어볼 수 있었어","situation":"좋은 기회를 얻어 해 볼 수 있었던 일을 돌아보며","ko":"제가 중국에서 공부하고 있을 때 신기한 음식을 많이 먹어볼 수 있었어요","en":"When I was studying in China, I got to try a lot of very unusual food.","nuance":"여기서도 got to가 '기회를 얻어 해 보다'입니다. 같은 틀로 I got to see what it was like to be a farmer(농부로 사는 게 어떤지 볼 수 있었다), We got to learn a lot about raising children(육아에 대해 많이 배울 수 있었다)처럼 씁니다. 반대로 기회를 놓친 쪽은 didn't get to입니다.","mistake":{"x":"I could try a lot of very unusual food.","o":"I got to try a lot of very unusual food.","why":"could는 '할 수 있었다'는 가능성입니다. 귀한 기회로 해 봤다는 만족은 got to에 담깁니다."},"variants":[{"en":"I got to see what it was like to be a farmer.","ko":"농부로 사는 게 어떤지 볼 수 있었어요."},{"en":"We got to learn a lot about raising children.","ko":"육아에 대해 많은 것을 배울 수 있어서 좋았어요."},{"en":"We didn't get to ask any questions, though. There wasn't enough time.","ko":"근데 질문은 못 했어요. 시간이 부족했거든요."}],"source":"Google Drive '영어 스터디' — get to 예문 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":3,"title":"그녀는 대학 때 하고 싶은 걸 많이 못 했어","situation":"해야 할 일 때문에 누리지 못한 것을 안타까워하며","ko":"그녀는 대학생 때 공부하지 않을 때는 일을 해야 했어요. 그래서 대학교 때 사람들이 보통 하고 싶어 하는 것들을 많이 못 했어요","en":"She had to work when she wasn't studying. So, she didn't get to do a lot of the things that people generally want to do when they're in college.","nuance":"had to는 '해야만 했다'는 의무, didn't get to는 '하지 못했다'는 기회의 박탈입니다. 두 동사를 나란히 두면 '의무 때문에 기회를 잃었다'는 인과가 저절로 생깁니다. want to do when they're in college처럼 뒤에 상황을 붙이면 무엇을 못 했는지 구체적으로 전달됩니다.","mistake":{"x":"She couldn't do a lot of things people want to do in college.","o":"She didn't get to do a lot of the things that people generally want to do when they're in college.","why":"couldn't는 능력이나 상황의 불가능입니다. '기회를 얻지 못했다'는 아쉬움은 didn't get to로 살립니다."},"variants":[{"en":"I didn't get to go home right after school.","ko":"학교 끝나고 바로 집에 가지 못했어요."},{"en":"We didn't get to ask any questions, though.","ko":"그런데 질문은 못 했어요."}],"source":"Google Drive '영어 스터디' — get to 예문 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":4,"title":"난 별로 재미없을 줄 알았는데 의외로 재밌더라","situation":"기대 없이 갔다가 생각보다 좋았던 것을 돌아보며","ko":"난 별로 재미없을 줄 알았는데 의외로 재밌더라","en":"I didn't think I'd enjoy it very much, but I found it surprisingly fun to watch.","nuance":"find는 '찾다'가 아니라 '~라고 느끼다, 알게 되다'입니다. find + 목적어 + 형용사 틀이라 I found it fun, We found everything to be well above average처럼 씁니다. 앞에 I didn't think I'd ~를 붙이면 '예상과 달랐다'는 반전이 생깁니다.","mistake":{"x":"I thought it wouldn't be fun but it was fun.","o":"I didn't think I'd enjoy it very much, but I found it surprisingly fun to watch.","why":"같은 말을 두 번 반복하면 밋밋합니다. 예상은 I didn't think I'd, 실제 느낌은 I found it ~로 나눠 담는 것이 영어식입니다."},"variants":[{"en":"I actually found it quite effective.","ko":"나한테는 꽤 효과가 있었어."},{"en":"We found everything to be well above average.","ko":"다 평균 이상이더라고."}],"source":"영어 뇌 만들기 — 한국인이 약한 find의 활용 · 라이브 아카데미","sourceUrl":"https://youtu.be/UbUKyw9nnpI"},{"n":5,"title":"3개월째 하고 있는데 아직도 너무 힘들어","situation":"꾸준히 해 보고 있지만 여전히 버겁다고 털어놓을 때","ko":"나도 아침 5시에 일어나는 거 거의 3개월째 하고 있는데 난 아직도 너무 힘들던데","en":"I've been trying the whole getting up at 5 thing for almost 3 months now and I still find it incredibly hard.","nuance":"find it hard는 '힘들다고 느낀다'는 틀입니다. 지금 겪는 중이면 진행형 I'm finding it even harder as time goes by, I'm finding it more demanding than I expected처럼 씁니다. 앞의 I've been trying ~ for 3 months가 '해 보고는 있다'는 맥락을 만들어 줍니다.","mistake":{"x":"I do it for 3 months but it is still very hard for me.","o":"I've been trying it for almost 3 months now and I still find it incredibly hard.","why":"I do it for 3 months는 현재 습관처럼 들립니다. 지금까지 이어져 온 기간은 have been ~ing for로 담습니다."},"variants":[{"en":"I'm finding it even harder as time goes by.","ko":"갈수록 더 어려워지는 것 같아."},{"en":"I'm finding it more demanding than I expected.","ko":"생각했던 것보다 훨씬 빡세."},{"en":"I'm finding it really hard to get anything done.","ko":"아무것도 제대로 하기가 정말 힘들어."}],"source":"영어 뇌 만들기 — 한국인이 약한 find의 활용 · 라이브 아카데미","sourceUrl":"https://youtu.be/UbUKyw9nnpI"},{"n":6,"title":"난 솔직히 우리가 거기 가는 게 실수라고 생각했는데 잘 맞더라고","situation":"가기 전에는 의심했는데, 막상 가 보니 생각과 달랐다고 말할 때","ko":"난 솔직히 우리가 거기 가는 게 실수라고 생각했는데 (막상 가보니) 우리랑 잘 맞더라고","en":"I honestly thought it was a mistake for us to go there, but we found ourselves fitting right in.","nuance":"find ourselves + -ing는 '어느새 ~하고 있는 자신을 발견했다'는 틀입니다. 그래서 '잘 맞더라'가 we fit in이 아니라 we found ourselves fitting right in이 됩니다. fit in은 '어울려 들다', right in은 '딱 맞게'입니다.","mistake":{"x":"We fit well there.","o":"We found ourselves fitting right in.","why":"We fit well there은 상태만 말합니다. '가 보니 어느새 어울려 있더라'는 발견의 뉘앙스는 found ourselves ~ing로 살립니다."},"variants":[{"en":"We found everything to be well above average.","ko":"다 평균 이상이더라고."},{"en":"I found it surprisingly fun to watch.","ko":"의외로 재밌더라."}],"source":"영어 뇌 만들기 — 한국인이 약한 find의 활용 · 라이브 아카데미","sourceUrl":"https://youtu.be/UbUKyw9nnpI"},{"n":7,"title":"걔는 유기견을 유난히 좋아해","situation":"좋아한다는 말을 넘어, 그 대상에 특별히 꽂혀 있다고 말할 때","ko":"걔는 유기견을 유난히 좋아해","en":"He has a thing for stray dogs.","nuance":"has a thing for는 '유난히 끌린다, 특별히 좋아한다'입니다. 좋아하는 이유를 설명하지 않아도 '왜인지 모르게 꽂혀 있다'는 뉘앙스가 담깁니다. 더 다정하게는 has a soft spot for. 반대로 싫어하거나 거부감이 있을 때는 전치사를 about으로 바꿔 has a thing about ~이라고 합니다.","mistake":{"x":"He specially likes stray dogs.","o":"He has a thing for stray dogs.","why":"specially likes는 어색한 조합입니다. 설명하기 어려운 '꽂힘'은 has a thing for로 말합니다."},"variants":[{"en":"He has a soft spot for stray dogs.","ko":"걔는 유기견을 유난히 마음에 담아 둬."},{"en":"She has a thing about European guys.","ko":"걔는 유럽 남자들한테 유별나."},{"en":"Catherine must have a thing for CMU grads.","ko":"캐서린은 CMU 출신을 유난히 선호하나 봐."}],"source":"like / not like 대신 많이 쓰는 영어 표현 · 라이브 아카데미","sourceUrl":"https://youtu.be/9XVD1M0Bkrw"},{"n":8,"title":"캐서린은 그런 사람을 보는 눈이 정말 좋아","situation":"사람을 알아보는 안목이 뛰어나다고 칭찬할 때","ko":"캐서린은 케니 같은 사람을 보는 눈이 정말 좋아","en":"Catherine really has a good eye for people like Kenny.","nuance":"have a good eye for는 '~을 보는 눈이 있다'는 굳은 틀입니다. 재능을 말할 때는 has a real knack for ~ing(타고난 재주가 있다)로 올라갑니다. 영상에서는 She's got a real knack for winning people's trust처럼 사람의 신뢰를 얻는 재주로 이어졌습니다.","mistake":{"x":"Catherine has good eyes to see people like Kenny.","o":"Catherine really has a good eye for people like Kenny.","why":"eye는 이 뜻으로 쓸 때 단수입니다. see people처럼 동사를 붙이지 않고 for + 명사로 받습니다."},"variants":[{"en":"She's got a real knack for winning people's trust.","ko":"그녀는 사람들의 신뢰를 얻는 타고난 재주가 있어."},{"en":"She has a thing about traditional hiring.","ko":"그녀는 전통적인 채용 방식에 유별난 고집이 있어."}],"source":"like / not like 대신 많이 쓰는 영어 표현 · 라이브 아카데미","sourceUrl":"https://youtu.be/9XVD1M0Bkrw"},{"n":9,"title":"물론 그게 말처럼 쉬운 일은 아니지","situation":"좋은 원칙을 말한 뒤, 실제로 하기는 어렵다고 솔직하게 덧붙일 때","ko":"물론 그게 말처럼 쉬운 일은 아니지","en":"It's easier said than done, of course.","nuance":"easier said than done은 '말은 쉬워도 행동은 어렵다'는 굳은 비교 표현입니다. 영상에서는 이어서 그렇게 오래 걸려 뽑은 사람이 회사를 위기에서 구했다는 결과로 넘어가며 ended up saving the company from a crisis, Turns out, it's well worth the time and effort라고 말합니다.","mistake":{"x":"It's easy to say but hard to do.","o":"It's easier said than done.","why":"뜻은 통하지만 원어민은 이 상황에서 비교급 관용구 하나로 끝냅니다. 짧은 관용구가 대화에서 더 자연스럽습니다."},"variants":[{"en":"But that person ended up saving the company from a crisis.","ko":"그런데 그 사람이 결국 회사를 위기에서 구해 냈어."},{"en":"Turns out, it's well worth the time and effort.","ko":"알고 보니 그 시간과 노력이 아주 값진 거였어."}],"source":"like / not like 대신 많이 쓰는 영어 표현 · 라이브 아카데미","sourceUrl":"https://youtu.be/9XVD1M0Bkrw"},{"n":10,"title":"나 할 게 좀 있어","situation":"지금 다른 일이 있어서 자리를 뜨거나 약속을 미뤄야 할 때","ko":"나 할 게 좀 있어","en":"I have something to do.","nuance":"have + 명사 + to do는 '~할 것이 있다'는 틀입니다. something을 a lot으로 바꾸면 '할 게 많아', nothing으로 바꾸면 '할 게 없어'가 됩니다. important를 끼워 I have something important to do라고 하면 '중요한 일이 있어'로 무게가 실립니다.","mistake":{"x":"I have to do something.","o":"I have something to do.","why":"have to do something은 '무언가를 해야 한다'는 의무입니다. '할 일이 있다'는 소유의 뜻은 have something to do 어순으로 씁니다."},"variants":[{"en":"I have a lot to do.","ko":"할 게 많아."},{"en":"I have nothing to do.","ko":"할 게 없어."},{"en":"I have something important to do.","ko":"중요한 일이 좀 있어."}],"source":"Google Drive '영어 스터디' — have + to do 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":11,"title":"같이 연습할 사람이 없어","situation":"무엇을 함께할 상대가 없다고 말할 때, 사람 수를 세는 표현으로","ko":"같이 연습할 사람이 없어","en":"I have no one to practice with.","nuance":"no one to practice with는 '함께 연습할 사람이 없다'입니다. with를 빼면 '연습할 사람'이 되어 뜻이 어긋납니다. 대화 상대는 no one to talk to, 이야기할 거리는 a lot to talk about처럼 명사 뒤에 전치사나 to부정사를 붙여 만듭니다.","mistake":{"x":"I have no one to practice.","o":"I have no one to practice with.","why":"practice는 '연습하다'는 동작이라 함께하는 상대에게는 with가 필요합니다."},"variants":[{"en":"I have a lot of people to talk to.","ko":"얘기할 사람이 많아."},{"en":"I have no one to talk to.","ko":"얘기할 사람이 없어."},{"en":"We had a lot to talk about.","ko":"우리는 할 얘기가 많았어."}],"source":"Goog n't have gone straight to bed는 '바로 자지 말걸', Then, I wouldn't have been so busy this morning은 '그랬으면 아침에 그렇게 바쁘지 않았을 텐데'입니다.","mistake":{"x":"It could be worse now.","o":"It could have been worse.","why":"이미 지나간 일을 돌아보는 자리라서 have been이 필요합니다. could be worse는 지금 상태를 두고 '더 나쁠 수도 있다'는 뜻이 됩니다."},"variants":[{"en":"At least now we know.","ko":"그래도 이젠 알았으니까."},{"en":"I shouldn't have gone straight to bed.","ko":"바로 자지 말걸."},{"en":"Then, I wouldn't have been so busy this morning.","ko":"그랬으면 아침에 그렇게 바쁘지 않았을 텐데."}],"source":"Google Drive '영어 스터디' — should have pp 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":5,"title":"내 일을 끝냈어야 했는데","situation":"해야 했는데 하지 않은 일을 돌아보며 아쉬워할 때","ko":"내 일을 끝냈어야 했는데","en":"I should've done my work.","nuance":"should've는 should have의 회화형으로, '~했어야 했는데 (안 했다)'는 후회입니다. 뒤에 Then, I wouldn't have been ~을 붙이면 그 결과까지 이어서 말할 수 있습니다. 발음은 '슈르브'에 가깝게 뭉개지므로 듣기에서도 이 형태로 알아들어야 합니다.","mistake":{"x":"I should finish my work yesterday.","o":"I should've done my work.","why":"지난 일에 대한 후회는 should + have + p.p.입니다. should finish는 지금부터 하라는 뜻이 됩니다."},"variants":[{"en":"Then, I wouldn't have been so busy this morning.","ko":"그랬으면 아침에 그렇게 바쁘지 않았을 텐데."},{"en":"I shouldn't have gone straight to bed.","ko":"바로 자지 말걸."}],"source":"Google Drive '영어 스터디' — should have pp 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":6,"title":"그 프로젝트는 진행 중이야","situation":"일이 어디까지 왔는지 말할 때, '진행 중'을 전치사 하나로 구분하며","ko":"그 프로젝트는 진행 중이야","en":"The project is in progress.","nuance":"진행 중은 in progress입니다. on progress라고 하면 틀립니다. 과정 자체를 말할 때는 in the process of ~ing를 씁니다. We are in the process of testing the product처럼 '지금 그 과정에 있다'는 뜻이 됩니다.","mistake":{"x":"The project is on progress.","o":"The project is in progress.","why":"progress 앞에는 on이 아니라 in을 씁니다. '진행 중'이라는 상태 안에 들어와 있다는 그림입니다."},"variants":[{"en":"We are in the process of testing the product.","ko":"우리 다기보다는."},{"en":"I just sent you an email.","ko":"방금 막 이메일 보냈어."},{"en":"It's not ideal, but it's better than doing nothing.","ko":"완벽하진 않지만 아무것도 안 하는 것보다는 낫지."},{"en":"It could be that he just forgot.","ko":"그냥 잊어버린 걸 수도 있어."},{"en":"I could be wrong.","ko":"내가 틀렸을 수도 있어."},{"en":"no particular reason","ko":"딱히 이유가 있는 건 아니고"},{"en":"Based on what I know","ko":"내가 알기로는 (격식)"},{"en":"According to what I know","ko":"내가 알기로는 (격식)"},{"en":"To my knowledge","ko":"내가 알기로는 (격식)"},{"en":"In my opinion","ko":"내 생각에는"},{"en":"I hope you find this helpful.","ko":"이게 도움이 됐으면 좋겠다."},{"en":"That's not your concern.","ko":"네가 신경 쓸 일 아니야."},{"en":"There's no shortcut to success.","ko":"성공에 지름길은 없어."}]},{"id":"c5","name":"실전 회화","subtitle":"대화체로 익히는 생활 표현","tagline":"라이브 아카데미 〈영어 뇌 만들기 PART 13 (대화체)〉와 실제 강의에서 다룬 대화 지문입니다. 한 문장씩 끊어 말해 보고, 이어지는 상대 대사까지 통째로 익혀 두세요.","units":[{"n":1,"title":"내 폰을 여기 어디에 뒀나?","situation":"집이나 사무실에서 휴대폰이 보이지 않아 여기저기 살피며","ko":"내가 내 폰을 여기 어디에 뒀나?","en":"Did I leave my phone here somewhere?","nuance":"leave는 '두고 오다, 두고 나오다'입니다. somewhere를 붙이면 '어딘가에'라는 막연한 장소가 됩니다. 이어서 I can't find it anywhere(아무리 찾아도 없네), I'm positive I had it in my hand when I came in(들어올 때 분명히 손에 들고 있었는데)처럼 확신과 의심이 번갈아 나오는 것이 이 대화의 리듬입니다.","mistake":{"x":"Did I put my phone here where?","o":"Did I leave my phone here somewhere?","why":"'어디에 두었지'를 where로 문장 안에 넣으면 의문사가 겹칩니다. 막연한 장소는 somewhere로 처리합니다."},"variants":[{"en":"I can't find it anywhere.","ko":"아무리 찾아도 없네."},{"en":"I'm positive I had it in my hand when I came in.","ko":"들어올 때 분명히 손에 들고 있었는데."}],"source":"영어 뇌 만들기 PART 13 (대화체) · 라이브 아카데미","sourceUrl":"https://youtu.be/InVSfdYG3Wk"},{"n":2,"title":"차에 두고 온 거 아니야?","situation":"여기저기 찾아도 없을 때, 마지막으로 있었던 곳을 짚어 주며","ko":"차에 두고 온 거 아니야?","en":"Maybe you left it in the car.","nuance":"maybe는 '어쩌면'이라는 가벼운 추측입니다. 같은 뜻을 좀 더 감각적으로 말하면 I have a feeling you left it in the car(왠지 차에 놓고 온 것 같아)입니다. 상대가 아니라고 우기면 It's possible, but I'm almost certain I had it with me when I came up처럼 인정과 확신을 한 문장에 담습니다.","mistake":{"x":"Isn't it that you left it in the car?","o":"Maybe you left it in the car.","why":"한국어 '~아니야?'를 부정의문문으로 옮기면 확인 질문이 아니라 다툼처럼 들립니다. 추측은 maybe로 가볍게 던집니다."},"variants":[{"en":"I have a feeling you left it in the car.","ko":"왠지 차에 두고 온 것 같아."},{"en":"It's possible, but I'm almost certain I had it with me when I came up.","ko":"그럴 수도 있는데, 올라올 때 분명히 갖고 있었던 것 같아."}],"source":"영어 뇌 만들기 PART 13 (대화체) · 라이브 아카데미","sourceUrl":"https://youtu.be/InVSfdYG3Wk"},{"n":3,"title":"화장실에 놓고 나왔나 보네","situation":"상대의 말을 듣고 그제야 기억이 떠올랐을 때","ko":"아, 맞다! 화장실에 놓고 나왔나 보네","en":"I must've left it in the bathroom.","nuance":"must've는 must have의 회화형으로, '~였나 보다'라는 강한 추측입니다. 지금 찾은 사실에 대한 납득이 담깁니다. 이어서 It's so weird, I don't remember putting it there처럼 remember + -ing(그곳에 둔 기억이 없다)를 쓰면 어리둥절함이 살아납니다.","mistake":{"x":"I must leave it in the bathroom.","o":"I must've left it in the bathroom.","why":"must leave는 '반드시 떠나야 한다'는 의무입니다. 지난 일에 대한 추측은 must have + p.p.입니다."},"variants":[{"en":"It's so weird, I don't remember putting it there.","ko":"진짜 이상하네, 거기 둔 기억이 전혀 없는데."}],"source":"영어 뇌 만들기 PART 13 (대화체) · 라이브 아카데미","sourceUrl":"https://youtu.be/InVSfdYG3Wk"},{"n":4,"title":"가서 확인해 봐야 알겠네","situation":"추측만으로는 결론이 안 나서, 직접 확인하는 수밖에 없다고 말할 때","ko":"가서 확인해 봐야 알겠네","en":"There's only one way to be sure.","nuance":"only one way to be sure는 '확실히 하려면 방법은 하나뿐'이라는 뜻입니다. 같은 상황을 조금 더 일상적으로 말하면 I guess you'll have to go and check입니다. 대화에서는 이렇게 결론을 미루고 행동으로 넘기는 표현이 자주 나옵니다.","mistake":{"x":"You have to go and check to know.","o":"There's only one way to be sure.","why":"to know를 덧붙이면 문장이 늘어지고 뜻이 흐려집니다. '확실히 하는 방법은 하나'라는 틀로 끊는 것이 자연스럽습니다."},"variants":[{"en":"I guess you'll have to go and check.","ko":"가서 확인해 봐야 알겠네."},{"en":"Maybe you left it in the car.","ko":"차에 두고 온 거 아니야?"}],"source":"영어 뇌 만들기 PART 13 (대화체) · 라이브 아카데미","sourceUrl":"https://youtu.be/InVSfdYG3Wk"},{"n":5,"title":"손목 왜 그래?","situation":"상대가 손목을 자꾸 만지작거릴 때, 걱정스럽게 물으며","ko":"손목 왜 그래?","en":"What's wrong with your wrist?","nuance": you say you were going to get a new phone?","why":"이미 한 말을 되짚는 자리라서 부정의문문 Didn't you say가 자연스럽고, 시제도 과거로 맞춥니다."},"variants":[{"en":"Oh, that's right! Check it out.","ko":"아 맞다! 이거 봐."},{"en":"What about your old one?","ko":"그럼 예전 폰은?"}],"source":"Google Drive '영어 스터디' — 실제 강의 대화 지문 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":11,"title":"계속 말썽을 부렸어","situation":"고장 난 물건을 여러 번 고쳐 봤지만 계속 문제를 일으켜 결국 바꿨다고 말할 때","ko":"고장 난 것 같았어. 몇 번이나 고쳐 봤는데 계속 말썽을 부렸어","en":"I think it was broken. I've tried getting it fixed several times, but it kept acting up.","nuance":"act up은 기계가 '말썽을 부리다'입니다. try + -ing는 '시험 삼아 해 보다'라서 getting it fixed several times가 '몇 번이나 고쳐 봤다'가 됩니다. kept -ing는 '계속 ~했다'로 반복된 짜증을 담습니다.","mistake":{"x":"It kept doing strange things.","o":"It kept acting up.","why":"strange things는 사람의 행동에 가깝습니다. 기계가 말썽 부리는 것은 act up이라는 굳은 표현을 씁니다."},"variants":[{"en":"I've tried getting it fixed several times.","ko":"몇 번이나 고쳐 봤어."},{"en":"So I decided it was time to get a new one.","ko":"그래서 새로 바꿀 때가 됐다 싶었어."}],"source":"Google Drive '영어 스터디' — 실제 강의 대화 지문 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"}],"extras":[{"en":"Did I leave my phone here somewhere?","ko":"내가 내 폰을 여기 어디에 뒀나?"},{"en":"I can't find it anywhere.","ko":"아무리 찾아도 없네."},{"en":"I'm positive I had it in my hand when I came in.","ko":"들어올 때 분명히 손에 들고 있었는데."},{"en":"Did you check all your pockets?","ko":"주머니는 다 찾아봤어?"},{"en":"I'll try calling it.","ko":"내가 전화 걸어 볼게."},{"en":"I'm pretty sure I have it muted, so I don't know if it'll help.","ko":"아마 무음으로 해놨을 거라 소용 없을 것 같긴 한데."},{"en":"Do you hear it?","ko":"들려?"},{"en":"There's only one way to be sure.","ko":"가서 확인해 봐야 알겠네."},{"en":"Was it there?","ko":"거기 있었어?"},{"en":"It's so weird, I don't remember putting it there.","ko":"진짜 이상하네, 거기 둔 기억이 전혀 없는데."},{"en":"What's wrong with your wrist?","ko":"손목 왜 그래?"},{"en":"It's a patch for the pain.","ko":"진통 패치야."},{"en":"How does it work?","ko":"어떻게 작동하는 거야?"},{"en":"Just think of it as a huge band-aid.","ko":"그냥 큰 반창고라고 생각해."},{"en":"How was your weekend? Did you do something?","ko":"주말 어떻게 보냈어? 뭐 좀 했어?"},{"en":"Didn't you say you were going to get a new phone?","ko":"새 폰 산다며?"},{"en":"I've tried getting it fixed several times, but it kept acting up.","ko":"몇 번이나 고쳐 봤는데 계속 말썽을 부렸어."},{"en":"So I decided it was time to get a new one.","ko":"그래서 새로 바꿀 때가 됐다 싶었어."},{"en":"Nice! What about your old one?","ko":"좋네! 그럼 예전 폰은?"},{"en":"Is there anything else that you want to try while you are here?","ko":"여기 있는 동안 더 해 보고 싶은 게 있어?"}]},{"id":"c6","name":"비즈니스 · 영업","subtitle":"바이어 응대 · 협상 · 면접 · 업무 보고","tagline":"해외 바이어와 일할 때 바로 쓰는 문장들입니다. 라이브 아카데미에서 정리한 영업 영어(공감하기 · 정보 얻기 · 문제 정면 돌파)와 면접·업무 표현을 실제 문장 그대로 담았습니다.","units":[{"n":1,"title":"품질 문제가 가장 중요하다고 생각하시는 거죠?","situation":"바이어의 우려를 정리해 확인하며, 내가 제대로 이해했는지 되물을 때","ko":"품질 문제가 가장 중요하다고 생각하시는 거죠? 제가 맞게 이해했을까요?","en":"It sounds like what's most important to you is the quality issue. Did I understand you correctly?","nuance":"It sounds like ~로 상대의 말을 요약해 주고, Did I understand you correctly?로 확인을 받습니다. 이 두 마디가 '공감하기'의 기본형입니다. 이어서 I completely understand your concerns about the order and product quality라고 받아 주면 협상의 문이 열립니다.","mistake":{"x":"You think quality is important, right?","o":"It sounds like what's most important to you is the quality issue. Did I understand you correctly?","why":"right?로 끝내면 확인이 아니라 압박처럼 들립니다. 상대의 말을 요약해 주고 내 이해를 묻는 방식이 정중합니다."},"variants":[{"en":"I completely understand your concerns about the order and product quality.","ko":"주문과 제품 품질에 대한 우려를 충분히 이해합니다."},{"en":"Your worries about costs are so reasonable, so maybe there is something we can work out.","ko":"비용에 대한 걱정은 충분히 이해됩니다. 저희가 해결할 방법이 있을 겁니다."}],"source":"Google Drive '영어 스터디' — 영업 영어 표현 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":2,"title":"혹시 왜 그런 결론에 도달하셨는지 여쭤봐도 될까요?","situation":"바이어가 부정적인 결론을 냈을 때, 이유를 캐묻지 않고 정중하게 확인하며","ko":"혹시 왜 그런 결론에 도달하셨는지 여쭤봐도 될까요?","en":"Can I ask what led you to that conclusion?","nuance":"what led you to ~는 '무엇이 당신을 그 결론으로 이끌었나'라는 틀이라, why로 묻는 것보다 훨씬 부드럽습니다. 이어서 Are there other parts of that you'd like me to know about?(그 외에 제가 알아야 할 부분이 있을까요)로 정보를 더 얻고, How would you like things to turn out?(어떻게 해결되길 원하시나요)로 목표를 확인합니다.","mistake":{"x":"Why did you think so?","o":"Can I ask what led you to that conclusion?","why":"Why did you think so?는 추궁처럼 들립니다. 상대의 판단 과정을 존중하며 묻는 것이 이 자리의 예의입니다."},"variants":[{"en":"Are there other parts of that you'd like me to know about?","ko":"그 외에 제가 추가로 알아야 할 부분이 있을까요?"},{"en":"How would you like things to turn out?","ko":"어떤 방식으로 해결되길 원하시나요?"}],"source":"Google Drive '영어 스터디' — 영업 영어 표현 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":3,"title":"저는 색상과 마감 이슈를 중요한 결함으로 보고 있습니다","situation":"납품 품질 회의에서, 어떤 문제가 결함인지 분명히 밝힐 때","ko":"저는 색상과 마감 이슈를 중요한 결함으로 보고 있습니다. 게다가 사이즈와 중량 왜곡 문제는 정말 심각한 부분이라, 문제가 발생하면 안 됩니다","en":"I see color and finish issues as major defects. On top of that, size and weight discrepancies are critical. We can't have any problems there.","nuance":"see A as B는 'A를 B로 보다'입니다. On top of that으로 문제를 하나 더 얹고, critical로 급을 올립니다. We can't have any problems there는 '거기서는 어떤 문제도 있어서는 안 된다'는 단호한 마무리입니다.","mistake":{"x":"Color and finish are big problems. Also size is very serious.","o":"I see color and finish issues as major defects. On top of that, size and weight discrepancies are critical.","why":"big problems, very serious는 감상에 가깝습니다. 결함(defects)과 치명적(critical)이라는 업무 용어로 급을 구분해 말해야 힘이 실립니다."},"variants":[{"en":"On top of that, size and weight discrepancies are critical.","ko":"게다가 사이즈와 중량 왜곡은 정말 심각합니다."},{"en":"We can't have any problems there.","ko":"거기서는 문제가 발생하면 안 됩니다."}],"source":"Google Drive '영어 스터디' — 영업 영어 표현 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":4,"title":"이 문제에 대해서는 타협할 수 없습니다","situation":"양보할 수 없는 조건을 분명히 해야 할 때, 강하게 밀되 예의를 지키며","ko":"이 문제에 대해서는 타협할 수 없습니다","en":"We cannot make any compromises on these issues.","nuance":"make a compromise on ~은 '~에 타협하다'입니다. some things are major concerns, but others are absolutely critical처럼 중요도가 다르다는 점을 먼저 깔아 두면, 이어지는 단호한 말이 훨씬 설득력 있게 들립니다.","mistake":{"x":"We can't compromise these issues.","o":"We cannot make any compromises on these issues.","why":"compromise는 자동사로도 쓰이지만 '~에 대해 타협하다'는 make a compromise on ~의 틀이 분명합니다. 전치사 on을 빠뜨리지 마세요."},"variants":[{"en":"Some things are major concerns, but others are absolutely critical.","ko":"어떤 것은 중요한 요소지만, 어떤 것은 정말로 필수입니다."},{"en":"Please pay extra attention to the critical ones.","ko":"특히 중요한 부분에 더욱 신경 써 주세요."}],"source":"Google Drive '영어 스터디' — 영업 영어 표현 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":5,"title":"양측에 이득이 되는 해결안을 찾을 수 있을 것으로 봅니다","situation":"가격이나 조건이 어긋났을 때, 문을 닫지 않고 함께 풀어 가자고 제안하며","ko":"양측에 이득이 되는 해결안을 찾을 수 있을 것으로 봅니다","en":"We believe we can work out a solution that benefits both sides.","nuance":"work out은 '관철하다'가 아니라 '고민해서 풀어내다'입니다. 뒤에 that benefits both sides를 붙이면 상대에게도 이득이라는 점이 분명해집니다. 좀 더 가볍게는 I'm sure it'll work out in the end이라고 안심시킵니다.","mistake":{"x":"We can find a good solution for both of us.","o":"We believe we can work out a solution that benefits both sides.","why":"find a good solution도 틀리지 않지만, 협상 자리에서는 work out(풀어내다)과 benefits both sides(양측에 이득)가 훨씬 전문적으로 들립니다."},"variants":[{"en":"Let me discuss it internally and see if we can work something out.","ko":"내부에서 논의해 보고 조정이 가능한지 보겠습니다."},{"en":"Don't worry too much. I'm sure it'll work out in the end.","ko":"너무 걱정 마세요. 결국 잘 풀릴 겁니다."}],"source":"Google Drive '영어 스터디' — 영업 영어 표현 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":6,"title":"내부에서 논의해 볼게요","situation":"그 자리에서 답할 수 없는 조건을 요구받았을 때, 시간을 벌며","ko":"내부에서 논의해 보고 조정이 가능한지 보겠습니다","en":"Let me discuss it internally and see if we can work something out.","nuance":"internally는 '사내에서'라는 뜻으로, 의사결정 권한이 내게 없다는 사실을 정중하게 전달합니다. see if we can ~은 '가능한지 확인해 보다'입니다. 일정 쪽이라면 If possible, we'd like to keep the schedule as is(가능하면 일정은 그대로 두고 싶다)를 붙입니다.","mistake":{"x":"I will talk about it inside.","o":"Let me discuss it internally and see if we can work something out.","why":"talk about it inside는 장소를 말하는 것처럼 들립니다. 사내 논의는 internally로, 결과는 work something out으로 담습니다."},"variants":[{"en":"We'll see if we can work something out.","ko":"조정이 가능한지 보겠습니다."},{"en":"If possible, we'd like to keep the schedule as is.","ko":"가능하면 일정은 그대로 유지하고 싶습니다."}],"source":"Google Drive '영어 스터디' — 영업 영어 표현 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":7,"title":"전문 분야는 무엇이세요?","situation":"면접이나 첫 미팅에서 상대의 일을 알아 갈 때","ko":"전문 분야는 무엇이세요?","en":"What's your area of expertise?","nuance":"expertise는 '전문성'입니다. 무엇을 하는 사람인지 물을 때는 Do you like working in this line of work?(이 분야에서 일하시는 건 마음에 드세요?), 지난 일을 물을 때는 How did you do in your last job?이 자연스럽습니다. 순서대로 물으면 대화가 부드럽게 이어집니다.","mistake":{"x":"What is your special area?","o":"What's your area of expertise?","why":"special area는 일상에서 쓰지 않는 조합입니다. 업무 면에서는 area of expertise가 표준입니다."},"variants":[{"en":"Do you like working in this line of work?","ko":"이 분야에서 일하시는 건 마음에 드세요?"},{"en":"How did you do in your last job?","ko":"전 직장에서는 어떻게 일하셨어요?"}],"source":"Google Drive '영어 스터디' — 면접 영어 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":8,"title":"저는 압박적인 환경에서 빛을 발합니다","situation":"일이 몰아치는 상황에서도 잘 해낸다고 자신을 소개할 때","ko":"저는 압박적인 환경에서 빛을 발합니다","en":"I thrive under pressure.","nuance":"thrive는 '잘 자라다, 번성하다'입니다. under pressure가 '압박 속에서'라서 '오히려 그때 힘을 낸다'는 뜻이 됩니다. 같은 자리에 I'm used to working under pressure를 놓으면 '익숙하다'는 쪽으로 조금 눅은 표현이 됩니다.","mistake":{"x":"I am strong when I get stress.","o":"I thrive under pressure.","why":"get stress는 어색하고, strong은 신체적인 힘처럼 들립니다. 압박 속에서 잘한다는 뜻은 thrive under pressure로 굳어 있습니다."},"variants":[{"en":"I'm used to working under pressure.","ko":"저는 압박 속에서 일하는 것에 익숙해요."}],"source":"Google Drive '영어 스터디' — 면접 영어 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":9,"title":"그건 너무 이른 것 같아요","situation":"일정이나 제안 시점이 앞당겨져야 한다는 요구에, 무리라고 말할 때","ko":"그건 너무 이른 것 같아요","en":"That might be too soon.","nuance":"might를 쓰면 '단정은 아니지만'이라는 여유가 생겨, 반대를 부드럽게 전달합니다. 대신 대안 시점을 물어야 대화가 막히지 않습니다. When do you think you can be ready?(언제쯤 준비 가능하세요?)가 그 자리에 옵니다.","mistake":{"x":"That is too early.","o":"That might be too soon.","why":"too early는 시각에 가깝고 단정적입니다. 일정·시점이 무리라는 판단에는 might be too soon이 정중합니다."},"variants":[{"en":"When do you think you can be ready?","ko":"언제쯤 준비되실 것 같으세요?"},{"en":"If possible, we'd like to keep the schedule as is.","ko":"가능하면 일정은 그대로 두고 싶습니다."}],"source":"Google Drive '영어 스터디' — 일정 협의 표현 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":10,"title":"사업 계획서는 어떻게 돼 가?","situation":"동료나 상사에게 진행 상황을 물으며, 내가 따라잡아야 할 것이 있는지 확인할 때","ko":"사업 계획서는 어떻게 돼 가? 안건이 뭐야? 내가 따라잡아야 할 중요한 내용 있어?","en":"How is the business plan going? What's on the agenda? Any major things I should track?","nuance":"How is ~ going?은 진행 상황을 묻는 기본 틀입니다. What's on the agenda?는 회의 안건을 묻고, Any major things I should track?은 내가 놓치면 안 되는 항목을 확인하는 말입니다. 이어서 The boss sent me some guidelines she wants us to consider라고 배경을 설명합니다.","mistake":{"x":"How about the business plan?","o":"How is the business plan going?","why":"How about ~?은 제안이나 화제 전환입니다. 진행 상황을 물으려면 How is ~ going?을 씁니다."},"variants":[{"en":"What's on the agenda? Any major things I should track?","ko":"안건이 뭐야? 내가 따라잡아야 할 중요한 내용 있어?"},{"en":"The boss sent me some guidelines she wants us to consider.","ko":"상사가 우리가 검토하길 바라는 지침을 보내 줬어."}],"source":"Google Drive '영어 스터디' — 업무 보고 표현 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"},{"n":11,"title":"그거 또 스팸 폴더에 있는 거 아냐?","situation":"메일을 못 받았다는 동료에게, 늘 그런 일이 있었다는 걸 기억하며","ko":"점심시간 바로 전에 보냈는데. 잠깐. 그거 또 스팸 폴더에 있는 거 아냐?","en":"I sent it right before lunch. Wait. Is it sitting in your spam folder again?","nuance":"is it sitting in ~은 '~에 들어가 있는 상태'를 그림처럼 보여 줍니다. 다시(old)라는 뜻은 again이 담당합니다. 메일을 방금 보냈다고 할 때는 I just sent you an email, 조금 전이라면 I sent you the email just before입니다.","mistake":{"x":"Is it in your spam folder again?","o":"Is it sitting in your spam folder again?","why":"문법적으로는 맞지만, sitting을 넣으면 '거기 처박혀 있냐'는 뉘앙스가 살아 대화가 훨씬 자연스럽습니다."},"variants":[{"en":"Right before lunch.","ko":"점심시간 바로 전에."},{"en":"I just sent you an email.","ko":"방금 막 이메일 보냈어."}],"source":"Google Drive '영어 스터디' — 업무 보고 표현 정리 (라이브 아카데미)","sourceUrl":"https://docs.google.com/document/d/1vozOWOYVlqIaQnRqYMosnsN1fJMHlw8UsSSjs7uzFTE/edit"}],"extras":[{"en":"We hope this meeting strengthens our long-term partnership.","ko":"이번 미팅이 장기 파트너십을 강화하기를 바랍니다."},{"en":"Thanks for being on top of it.","ko":"잘 처리해 줘서 고마워."},{"en":"Well, that covers what I wanted to talk about.","ko":"자, 제가 얘기하고 싶었던 건 다 다뤘네요."},{"en":"We gotta do what we gotta do.","ko":"우리는 시키면 해야지."},{"en":"If you don't mind me asking","ko":"이런 질문 드려도 될지 모르겠지만"},{"en":"First off","ko":"우선, 먼저"},{"en":"Let's break it down.","ko":"자세히 살펴봅시다."},{"en":"That tends to happen when American companies try to penetrate Asia.","ko":"이는 미국 기업이 아시아에 진출하려 할 때 발생하는 경향이 있습니다."},{"en":"That's always a difficult issue to handle.","ko":"이는 항상 처리하기 어려운 문제입니다."},{"en":"How much longer until we finish?","ko":"우리 끝날 때까지 얼마나 더 걸려요?"},{"en":"Can we jump on a zoom call real quick?","ko":"잠깐 줌으로 통화할 수 있어?"},{"en":"There was a time we encountered an issue with localizing a client's product.","ko":"고객사 제품 현지화에 문제가 생겼던 적이 있습니다."},{"en":"Is this really necessary?","ko":"이 건은 정말 필수사항인가요?"},{"en":"The best option is to keep this schedule.","ko":"가장 좋은 선택은 이 일정을 유지하는 것입니다."},{"en":"We'll see if we can work something out.","ko":"조정이 가능한지 보겠습니다."},{"en":"Give me an instance where you had to step up for your role.","ko":"자신의 역할을 위해 스스로 나서야 했던 사례를 들어 주세요."},{"en":"Pretend that you are at an actual interview and record yourself.","ko":"실제 면접을 보고 있다고 가정하고 자신을 녹음하세요."},{"en":"This will also get easier with more practice and more experience doing interviews.","ko":"이 또한 연습과 면접 경험이 쌓이면 더 쉬워질 겁니다."},{"en":"How did you guys decide to proceed?","ko":"어떻게 진행하기로 하셨나요?"},{"en":"Do we really need to proceed with this?","ko":"이 건은 정말 진행해야 하는 건가요?"},{"en":"Is this a must?","ko":"이거 꼭 해야 하는 거예요?"},{"en":"Could you confirm whether this is a mandatory requirement?","ko":"이게 필수 요건인지 확인해 주시겠어요?"},{"en":"Please let me know if this is a critical requirement.","ko":"이게 꼭 필요한 요건인지 알려 주세요."},{"en":"The sales report has been finalized.","ko":"영업 보고서는 마무리됐습니다."},{"en":"The most reasonable option is to proceed as scheduled.","ko":"가장 합리적인 선택은 예정대로 진행하는 것입니다."},{"en":"Would you like to give it a try?","ko":"한번 사용해 보시겠어요?"},{"en":"Your answer is becoming more compelling.","ko":"여러분의 답변이 점점 더 설득력을 얻고 있습니다."},{"en":"Does that work for you?","ko":"그걸로 괜찮으신가요?"},{"en":"The client asked for better payment terms.","ko":"고객사가 더 나은 결제 조건을 요청했습니다."},{"en":"I'm still worried about the budget issue.","ko":"저는 아직도 예산 문제가 걱정됩니다."},{"en":"Do you prefer any particular type of sandwich, like a chicken or ham one?","ko":"특별히 선호하는 샌드위치 종류가 있으세요? 치킨이나 햄 같은 거요."}]}]}</script>
<script>
/* 영어뇌 랩 — app logic (vanilla JS, no dependencies)
   Flow per unit: ① 한국어만 보고 말하기 → ② 핵심 문장 + 뉘앙스 해설 → ③ 변형 드릴 → ④ 완료
   Storage key: liveacademy.v1 */
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('app-data').textContent);
  var LS_KEY = 'liveacademy.v1';
  var UNITS = [];        // flat list of {ch, unit, id}
  var CH = {};           // chapter id -> chapter

  DATA.chapters.forEach(function (ch) {
    CH[ch.id] = ch;
    ch.units.forEach(function (u) {
      u.id = ch.id + '-' + u.n;
      u.chapterId = ch.id;
      UNITS.push({ id: u.id, ch: ch, unit: u });
    });
  });
  var TOTAL = UNITS.length;

  var S = {
    progress: {},                       // unitId -> {done, at, score}
    days: {},                           // 'YYYY-MM-DD' -> units completed that day
    streak: { count: 0, last: '' },
    settings: { theme: 'system', rate: 1, autoPlay: true },
    ui: { tab: 'home', chapter: '' }
  };
  var UI = { tab: 'home', open: '' };
  var L = null;   // lesson state
  var R = null;   // review state
  var rate = 1;

  /* ---------------------------------------------------------------- helpers */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function shiftDay(str, delta) {
    var p = str.split('-');
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    dt.setDate(dt.getDate() + delta);
    return todayStr(dt);
  }
  function toast(msg) {
    var t = $('#toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }
  function unitById(id) {
    for (var i = 0; i < UNITS.length; i++) if (UNITS[i].id === id) return UNITS[i];
    return null;
  }
  function nextUnitId(id) {
    for (var i = 0; i < UNITS.length; i++) if (UNITS[i].id === id) return UNITS[i + 1] ? UNITS[i + 1].id : null;
    return null;
  }
  function isDone(id) { return !!(S.progress[id] && S.progress[id].done); }
  function doneCount() {
    var n = 0;
    for (var i = 0; i < UNITS.length; i++) if (isDone(UNITS[i].id)) n++;
    return n;
  }
  function chapterDone(ch) {
    var n = 0;
    ch.units.forEach(function (u) { if (isDone(u.id)) n++; });
    return n;
  }

  /* ------------------------------------------------------------- persistence */
  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      if (o.progress && typeof o.progress === 'object') S.progress = o.progress;
      if (o.days && typeof o.days === 'object') S.days = o.days;
      if (o.streak) S.streak = { count: o.streak.count || 0, last: o.streak.last || '' };
      if (o.settings) S.settings = Object.assign(S.settings, o.settings);
      if (o.ui) S.ui = Object.assign(S.ui, o.ui);
    } catch (e) { /* corrupted storage: start fresh */ }
  }
  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        progress: S.progress, days: S.days, streak: S.streak, settings: S.settings, ui: S.ui
      }));
    } catch (e) { /* storage full or blocked */ }
  }

  /* ------------------------------------------------------------------ theme */
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyTheme() {
    var t = S.settings.theme || 'system';
    var dark = t === 'dark' || (t === 'system' && mq && mq.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#05141d' : '#0A2239');
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);

  /* ----------------------------------------------------------------- streak */
  function currentStreak() {
    var t = todayStr();
    if (S.streak.last === t) return S.streak.count || 0;
    if (S.streak.last === shiftDay(t, -1)) return S.streak.count || 0;
    return 0;
  }
  function bumpStreak() {
    var t = todayStr();
    S.days[t] = (S.days[t] || 0) + 1;
    if (S.streak.last === t) { save(); return; }
    S.streak.count = (S.streak.last === shiftDay(t, -1)) ? (S.streak.count || 0) + 1 : 1;
    S.streak.last = t;
    save();
  }

  /* -------------------------------------------------------- speech synthesis */
  var voices = [];
  function refreshVoices() {
    try { voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; } catch (e) { voices = []; }
  }
  if ('speechSynthesis' in window) {
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }
  function pickVoice() {
    var prefs = ['Google US English', 'Samantha', 'Ava', 'Allison',
      'Microsoft Aria Online (Natural)', 'Microsoft Jenny Online (Natural)', 'Microsoft Zira', 'Karen', 'Daniel', 'Alex'];
    var i, j;
    for (i = 0; i < prefs.length; i++) for (j = 0; j < voices.length; j++) if (voices[j].name === prefs[i]) return voices[j];
    for (i = 0; i < voices.length; i++) if (/^en[-_]US/i.test(voices[i].lang)) return voices[i];
    for (i = 0; i < voices.length; i++) if (/^en/i.test(voices[i].lang)) return voices[i];
    return null;
  }
  function speak(text, r) {
    if (!('speechSynthesis' in window)) { toast('이 브라우저는 음성 재생을 지원하지 않아요.'); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if (v) u.voice = v;
      u.lang = (v && v.lang) || 'en-US';
      u.rate = r || rate || 1;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
    } catch (e) { toast('음성을 재생하지 못했어요.'); }
  }

  /* ------------------------------------------------------ speech recognition */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recog = null;
  function srSupported() { return !!SR; }
  function listen(onResult, onEnd) {
    if (!SR) { onEnd && onEnd('unsupported'); return null; }
    try {
      if (recog) { try { recog.abort(); } catch (e) { } }
      var r = new SR();
      r.lang = 'en-US';
      r.interimResults = false;
      r.maxAlternatives = 1;
      r.continuous = false;
      var done = false;
      r.onresult = function (ev) {
        done = true;
        var txt = '';
        for (var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript + ' ';
        onResult(txt.trim());
      };
      r.onerror = function (ev) { done = true; onEnd && onEnd(ev.error || 'error'); };
      r.onend = function () { if (!done) onEnd && onEnd('no-speech'); };
      recog = r;
      r.start();
      return r;
    } catch (e) {
      onEnd && onEnd('start-failed');
      return null;
    }
  }

  /* --------------------------------------------------------------- scoring */
  var CONTR = {
    "i'm": 'i am', "i've": 'i have', "i'll": 'i will', "i'd": 'i would',
    "you're": 'you are', "you've": 'you have', "you'll": 'you will', "you'd": 'you would',
    "we're": 'we are', "we've": 'we have', "we'll": 'we will', "we'd": 'we would',
    "they're": 'they are', "they've": 'they have', "they'll": 'they will',
    "he's": 'he is', "she's": 'she is', "it's": 'it is', "that's": 'that is',
    "there's": 'there is', "what's": 'what is', "let's": 'let us', "here's": 'here is',
    "don't": 'do not', "doesn't": 'does not', "didn't": 'did not',
    "can't": 'cannot', "couldn't": 'could not', "won't": 'will not',
    "wouldn't": 'would not', "shouldn't": 'should not', "isn't": 'is not',
    "aren't": 'are not', "wasn't": 'was not', "weren't": 'were not',
    "haven't": 'have not', "hasn't": 'has not', "hadn't": 'had not',
    "gonna": 'going to', "wanna": 'want to', "gotta": 'got to'
  };
  function cleanWord(w) {
    return String(w).toLowerCase().replace(/[’‘`]/g, "'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, '');
  }
  function expand(s) {
    var orig = String(s).replace(/[’‘`]/g, "'").replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
    var words = [], map = [];
    orig.forEach(function (w, i) {
      var c = cleanWord(w);
      if (!c) { map.push(i); return; }
      var m = CONTR[c];
      if (m) m.split(' ').forEach(function (x) { words.push(x); map.push(i); });
      else { words.push(c); map.push(i); }
    });
    return { orig: orig, words: words, map: map };
  }
  function evaluate(target, said) {
    var t = expand(target), s = expand(said);
    var n = t.words.length, m = s.words.length, i, j;
    var dp = [];
    for (i = 0; i <= n; i++) { dp[i] = []; for (j = 0; j <= m; j++) dp[i][j] = 0; }
    for (i = 1; i <= n; i++) {
      for (j = 1; j <= m; j++) {
        dp[i][j] = t.words[i - 1] === s.words[j - 1]
          ? dp[i - 1][j - 1] + 1
          : Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
    var ok = new Array(n);
    for (i = 0; i < n; i++) ok[i] = false;
    var a = n, b = m;
    while (a > 0 && b > 0) {
      if (t.words[a - 1] === s.words[b - 1]) { ok[a - 1] = true; a--; b--; }
      else if (dp[a - 1][b] >= dp[a][b - 1]) a--; else b--;
    }
    var origOk = new Array(t.orig.length);
    for (i = 0; i < t.orig.length; i++) origOk[i] = false;
    for (i = 0; i < n; i++) if (ok[i]) origOk[t.map[i]] = true;
    for (i = 0; i < t.orig.length; i++) if (!cleanWord(t.orig[i])) origOk[i] = true;
    var matched = dp[n][m];
    var pct = n ? Math.round(matched / n * 100) : 0;
    var marks = t.orig.map(function (w, k) {
      return '<span class="w ' + (origOk[k] ? 'ok' : 'miss') + '">' + esc(w) + '</span>';
    }).join(' ');
    return { pct: pct, matched: matched, total: n, marks: marks, origOk: origOk };
  }

    if (pct >= 80) return ['good', '아주 좋아요. 이 문장은 이제 입에 붙었어요.'];
    if (pct >= 60) return ['mid', '좋아요. 빠진 단어만 다시 한 번 붙여 말해 보세요.'];
    if (pct >= 35) return ['mid', '핵심은 잡았어요. 0.8배속으로 듣고 천천히 따라 해 보세요.'];

  function startReview() {
