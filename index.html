      '<h2>설정</h2>' +

      '<div class="field"><label>테마</label><div class="seg" id="theme-seg">' +
        '<button data-act="set-theme" data-v="system" aria-pressed="' + (S.settings.theme === 'system') + '">시스템</button>' +
        '<button data-act="set-theme" data-v="light" aria-pressed="' + (S.settings.theme === 'light') + '">라이트</button>' +
        '<button data-act="set-theme" data-v="dark" aria-pressed="' + (S.settings.theme === 'dark') + '">다크</button>' +
      '</div></div>' +

      '<div class="field"><label>기본 재생 속도</label><div class="seg" id="rate-seg">' +
        '<button data-act="set-rate" data-v="1" aria-pressed="' + (S.settings.rate === 1) + '">1.0x</button>' +
        '<button data-act="set-rate" data-v="0.8" aria-pressed="' + (S.settings.rate === 0.8) + '">0.8x</button>' +
        '<button data-act="set-rate" data-v="0.7" aria-pressed="' + (S.settings.rate === 0.7) + '">0.7x</button>' +
      '</div><p class="hint">2단계 카드에서 1.0x / 0.8x / 아주 느리게를 바로 고를 수도 있어요.</p></div>' +

      '<div class="field"><label>학습</label>' +
        '<div class="switch"><div><span>자동 재생</span><small>2단계에서 핵심 문장을 바로 들려줍니다</small></div>' +
          '<button class="tgl" data-act="toggle-autoplay" role="switch" aria-checked="' + !!S.settings.autoPlay + '" aria-label="자동 재생"></button></div>' +
      '</div>' +

      '<div class="field"><label>백업 / 복원</label>' +
        '<div class="mic-row"><button class="btn" data-act="backup-file">파일로 저장</button>' +
        '<button class="btn" data-act="backup-copy">JSON 복사</button></div>' +
        '<textarea id="backup-json" hidden readonly aria-label="백업 JSON"></textarea>' +
        '<p class="hint">복원은 파일을 고르거나 아래에 JSON을 붙여넣어 진행합니다.</p>' +
        '<div class="mic-row" style="margin-top:8px"><button class="btn" data-act="restore-pick">파일에서 복원</button>' +
        '<button class="btn" data-act="restore-text">붙여넣은 JSON 복원</button></div>' +
        '<textarea id="restore-json" placeholder="여기에 백업 JSON을 붙여넣으세요" aria-label="복원할 JSON"></textarea>' +
        '<input id="restore-file" type="file" accept="application/json,.json" hidden />' +
        '<p class="hint" id="restore-msg"></p>' +
      '</div>' +

      '<div class="field"><label>위험</label>' +
        '<button class="btn block danger" data-act="reset">학습 기록 모두 지우기</button>' +
        '<p class="small">진도·연속 학습·학습한 날 기록이 삭제됩니다. 백업이 있으면 복원할 수 있어요.</p>' +
      '</div>' +

      '<button class="btn primary block" data-act="settings-close">닫기</button>' +
      '</div>';
  }
  function closeSettings() {
    var m = $('#modal');
    if (!m) return;
    m.hidden = true;
    m.innerHTML = '';
  }

  /* ------------------------------------------------------------------ mic */
  function handleMic(i) {
    if (!srSupported()) {
      toggleType(i, true);
      toast('이 브라우저는 음성 인식을 지원하지 않아요. 직접 입력해 주세요.');
      return;
    }
    var target = targetFor(i);
    if (!target) return;
    UI.listening = i;
    renderLessonPartial();
    listen(function (said) {
      UI.listening = null;
      recordSaid(i, said, target);
    }, function (err) {
      UI.listening = null;
      renderLessonPartial();
      if (err === 'not-allowed' || err === 'service-not-allowed') toast('마이크 권한이 필요해요. 브라우저 설정에서 허용해 주세요.');
      else if (err !== 'aborted') toast('잘 들리지 않았어요. 다시 시도하거나 타이핑으로 입력해 주세요.');
    });
  }
  function targetFor(i) {
    if (!L) return '';
    if (i === 'key') return L.unit.en;
    if (/^v\d+$/.test(i)) return L.unit.variants[+i.slice(1)].en;
    return '';
  }
  function recordSaid(i, said, target) {
    if (!L) return;
    L.said[i] = said;
    var ev = evaluate(target, said);
    L.res[i] = ev.pct;
    L.done[i] = true;
    if (i === 'key' && ev.pct >= 80) L.revealed.key = true;
    renderLessonPartial();
    toast(ev.pct >= 80 ? '좋아요, ' + ev.pct + '% 일치!' : '기록했어요 · ' + ev.pct + '% 일치');
  }
  function renderLessonPartial() {
    if (!L) return;
    var keyBox = $('#res-key');
    if (keyBox && L.said.key) keyBox.innerHTML = resultHtml(L.unit.en, L.said.key, L.step === 1);
    L.unit.variants.forEach(function (v, i) {
      var box = $('#res-v' + i);
      if (box && L.said['v' + i]) box.innerHTML = resultHtml(v.en, L.said['v' + i]);
    });
    renderLesson();
  }
  function toggleType(i, force) {
    var box = $('#type-' + i);
    if (!box) return;
    var want = (typeof force === 'boolean') ? force : !!box.hidden;
    box.hidden = !want;
    if (want) {
      var inp = box.querySelector('input');
      if (inp && inp.focus) inp.focus();
    }
  }

  /* --------------------------------------------------------------- render */
  function render() {
    if (UI.tab === 'home') renderHome();
    else if (UI.tab === 'review') renderReview();
    else renderStats();
    updateChrome();
    if (typeof window.scrollTo === 'function') window.scrollTo(0, 0);
  }

  /* --------------------------------------------------------------- events */
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'tab') {
      UI.tab = el.getAttribute('data-tab');
      if (UI.tab !== 'review') R = null;
      render();
      return;
    }
    if (act === 'chapter') {
      var cid = el.getAttribute('data-ch');
      if (!cid) return;
      UI.open = (UI.open === cid) ? '' : cid;
      S.ui.chapter = UI.open;
      save();
      render();
      return;
    }
    if (act === 'unit') { openUnit(el.getAttribute('data-id')); return; }
    if (act === 'close-lesson') { closeLesson(); return; }
    if (act === 'next') {
      if (L && L.step < 4) { L.step++; renderLesson(); }
      return;
    }
    if (act === 'prev') { if (L && L.step > 1) { L.step--; renderLesson(); } return; }
    if (act === 'next-unit') { openUnit(el.getAttribute('data-id')); return; }
    if (act === 'complete') {
      if (!L) return;
      var d = todayStr();
      if (!isDone(L.id)) {
        S.progress[L.id] = { done: true, at: d, score: L.res.key || 0 };
        bumpStreak();
        save();
        toast('완료! 진도에 기록했어요.');
      } else {
        S.progress[L.id].at = d;
        if (L.res.key) S.progress[L.id].score = L.res.key;
        save();
        toast('복습 기록을 저장했어요.');
      }
      var nx = nextUnitId(L.id);
      if (nx) { openUnit(nx); } else { closeLesson(); }
      return;
    }
    if (act === 'say') {
      var txt = el.getAttribute('data-say') || '';
      var r = parseFloat(el.getAttribute('data-rate')) || 1;
      speak(txt, r);
      return;
    }
    if (act === 'mic') { handleMic(el.getAttribute('data-i')); return; }
    if (act === 'toggle-type') { toggleType(el.getAttribute('data-i')); return; }
    if (act === 'submit-type') {
      var i = el.getAttribute('data-i');
      var box = $('#type-' + i);
      var inp = $('#type-' + i + ' input') || (box ? box.querySelector('input') : null);
      var val = (inp && inp.value || '').trim();
      if (!val) { toast('문장을 입력해 주세요.'); return; }
      var tgt = targetFor(i);
      if (!tgt) return;
      recordSaid(i, val, tgt);
      if (inp) inp.value = '';
      toggleType(i, false);
      return;
    }
    if (act === 'reveal') {
      var vi = el.getAttribute('data-i');
      if (!L) return;
      L.revealed[vi] = !L.revealed[vi];
      renderLesson();
      return;
    }

    /* review */
    if (act === 'review-mode') {
      S.settings.reviewMode = el.getAttribute('data-v');
      save();
      renderReview();
      return;
    }
    if (act === 'review-start') { startReview(); renderReview(); return; }
    if (act === 'review-opt') {
      if (!R || R.answered) return;
      var idx = +el.getAttribute('data-i');
      var q = R.items[R.idx];
      R.picked = idx;
      R.pickedEn = q.options[idx];
      R.answered = true;
      if (R.pickedEn === q.unit.en) R.correct++;
      renderReview();
      return;
    }
    if (act === 'review-mic') {
      if (!R || R.answered) return;
      var qq = R.items[R.idx];
      if (!srSupported()) { toggleType('rv', true); toast('음성 인식을 지원하지 않아요. 직접 입력해 주세요.'); return; }
      listen(function (said) {
        R.said = said; R.answered = true;
        if (evaluate(qq.unit.en, said).pct >= 80) R.correct++;
        renderReview();
      }, function (err) {
        if (err !== 'aborted') toast('잘 들리지 않았어요. 다시 시도해 주세요.');
      });
      toast('듣고 있어요…');
      return;
    }
    if (act === 'review-say') {
      if (!R || R.answered) return;
      var ri = $('#rv-input');
      var rv = (ri && ri.value || '').trim();
      if (!rv) { toast('답을 입력해 주세요.'); return; }
      R.said = rv; R.answered = true;
      if (evaluate(R.items[R.idx].unit.en, rv).pct >= 80) R.correct++;
      renderReview();
      return;
    }
    if (act === 'review-next') {
      if (!R) return;
      if (R.idx < R.items.length - 1) { R.idx++; R.answered = false; R.said = ''; R.picked = null; renderReview(); }
      else finishReview();
      return;
    }
    if (act === 'review-again') { R = null; startReview(); renderReview(); return; }
    if (act === 'review-close') { R = null; renderReview(); return; }

    /* settings */
    if (act === 'settings') { openSettings(); return; }
    if (act === 'settings-close') { closeSettings(); return; }
    if (act === 'backup-file') { downloadBackup(); return; }
    if (act === 'backup-copy') { copyBackup(); return; }
    if (act === 'restore-pick') { var rf = $('#restore-file'); if (rf && rf.click) rf.click(); return; }
    if (act === 'restore-text') { var rt = $('#restore-json'); applyBackup(rt ? rt.value : ''); return; }
    if (act === 'set-theme') {
      S.settings.theme = el.getAttribute('data-v');
      applyTheme(); save();
      $$('#theme-seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === el)); });
      return;
    }
    if (act === 'set-rate') {
      S.settings.rate = parseFloat(el.getAttribute('data-v'));
      rate = S.settings.rate;
      save();
      var seg = el.parentNode;
      if (seg && seg.querySelectorAll) $$('button', seg).forEach(function (b) { b.setAttribute('aria-pressed', String(b === el)); });
      return;
    }
    if (act === 'toggle-autoplay') {
      S.settings.autoPlay = !S.settings.autoPlay;
      el.setAttribute('aria-checked', String(S.settings.autoPlay));
      save();
      return;
    }
    if (act === 'reset') {
      if (window.confirm('학습 기록을 모두 지울까요? 되돌릴 수 없어요.')) {
        S.progress = {}; S.days = {}; S.streak = { count: 0, last: '' };
        R = null;
        save(); closeSettings(); render();
        toast('학습 기록을 초기화했어요.');
      }
      return;
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.id === 'restore-file') {
      var f = t.files && t.files[0];
      restoreFromFile(f);
      t.value = '';
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var t = e.target;
    if (!t) return;
    if (t.getAttribute && t.getAttribute('data-input') != null) {
      var i = t.getAttribute('data-input');
      var btn = document.querySelector('[data-act="submit-type"][data-i="' + i + '"]');
      if (btn) btn.click();
    } else if (t.id === 'rv-input') {
      var b = document.querySelector('[data-act="review-say"]');
      if (b) b.click();
    }
  });

  var scrollHandler = function () {
    var tb = document.querySelector('.topbar');
    if (tb) {
      if ((window.scrollY || 0) > 4) tb.classList.add('scrolled');
      else tb.classList.remove('scrolled');
    }
  };
  if (window.addEventListener) window.addEventListener('scroll', scrollHandler, { passive: true });

  /* ------------------------------------------------------------------ boot */
  load();
  rate = S.settings.rate || 1;
  applyTheme();
  if (S.ui.chapter) UI.open = S.ui.chapter;
  if (S.settings.autoPlay == null) S.settings.autoPlay = true;
  render();

  /* --------------------------------------------------- service worker (PWA) */
  try {
    var secure = typeof location !== 'undefined' &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
    if (secure && typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache unavailable */ });
      });
    }
  } catch (e) { /* non-browser environment */ }

  window.EnglishBrainLab = {
    state: S,
    data: DATA,
    units: UNITS,
    evaluate: evaluate,
    backupJson: backupJson,
    restore: applyBackup,
    open: openUnit,
    reset: function () {
      S.progress = {}; S.days = {}; S.streak = { count: 0, last: '' };
      save(); R = null; render();
    }
  };
})();

</script>
</body>
</html>
